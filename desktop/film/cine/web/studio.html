<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cine Studio — VideoStudio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #121418; --panel: #1a1d23; --panel2: #20242c; --line: #2c313b; --ink: #e8eaf0; --dim: #9aa3b2; --acc: #ffb454; --ok: #5fd08a; --bad: #ff6b6b; --code: #c9d1e3; --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace; }
  * { box-sizing: border-box; } html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  button, select, input { font: inherit; color: inherit; } button, select { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; } button:hover, select:hover { border-color: #465064; } button.pri { background: var(--acc); color: #1b1407; border-color: var(--acc); font-weight: 600; }
  button:focus-visible, select:focus-visible, input:focus-visible, .row:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
  header { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); } header h1 { font-size: 14px; margin: 0 8px 0 0; letter-spacing: .02em; } header .sp { flex: 1; } .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #2a3140; color: var(--dim); } #status { color: var(--dim); max-width: 38vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { display: grid; grid-template-columns: 270px minmax(360px, 1fr) minmax(340px, 38vw); height: calc(100% - 46px); }
  section { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); } section:last-child { border-right: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--panel); } .tabs button { flex: 1; border: 0; border-radius: 0; background: none; padding: 9px 6px; color: var(--dim); border-bottom: 2px solid transparent; } .tabs button.on { color: var(--ink); border-bottom-color: var(--acc); }
  .list { overflow: auto; flex: 1; padding: 6px; } .row { padding: 7px 9px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; } .row:hover { background: var(--panel); } .row.on { background: var(--panel2); border-color: var(--line); } .row b { font-weight: 600; } .row small { display: block; color: var(--dim); margin-top: 2px; max-height: 3.9em; overflow: hidden; } .row .t { float: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .mod { margin: 8px 4px 2px; color: var(--acc); font-weight: 600; cursor: pointer; } .mod span { color: var(--dim); font-weight: 400; } .item code { font-family: var(--mono); font-size: 12px; color: var(--code); }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #0b0c0f; position: relative; padding: 10px; } #view { position: relative; height: 100%; max-width: 100%; } #view canvas { height: 100%; width: 100%; display: block; border-radius: 6px; } #guides { position: absolute; inset: 0; pointer-events: none; } #busy { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000a; padding: 8px 14px; border-radius: 8px; display: none; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--panel); } #seek { flex: 1; accent-color: var(--acc); } #time { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 150px; text-align: right; } #marks { position: relative; height: 6px; margin: 0 12px; } #marks i { position: absolute; top: 0; width: 1px; height: 6px; background: #55607a; }
  #under { max-height: 38%; overflow: auto; border-top: 1px solid var(--line); background: var(--panel); padding: 8px 12px; display: none; } #under h3 { margin: 4px 0 6px; font-size: 12px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; } #under table { border-collapse: collapse; width: 100%; } #under td { padding: 3px 8px 3px 0; vertical-align: top; } .ok { color: var(--ok); } .bad { color: var(--bad); } #live { display: flex; gap: 12px; align-items: flex-start; } #live canvas { height: 150px; border-radius: 6px; background: #000; }

  header button, header select, header label, header h1, #codebar button { white-space: nowrap; } header { overflow: hidden; } #status { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ta { flex: 1; resize: none; border: 0; outline: 0; background: #14161b; color: var(--code); font: 12px/1.5 var(--mono); padding: 8px 12px; tab-size: 2; white-space: pre; overflow: auto; } #view.insp { cursor: grab; outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 6px; } button.on { border-color: var(--acc); color: var(--acc); }
  #tune { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 16px; margin-bottom: 6px; } #tune label { display: flex; align-items: center; gap: 8px; font-size: 12px; } #tune input[type=range] { flex: 1; accent-color: var(--acc); } #tune output { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 52px; text-align: right; } #tune .wide { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; } #tune .wide button, #tune .wide b { white-space: nowrap; }
  .cp { float: right; font-size: 11px; padding: 1px 7px; border-radius: 6px; }
  .k { color: #c792ea; } .s { color: #a5d6a7; } .c { color: #6b778d; } .n { color: #f6b26b; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style></head>
<body>
<header><h1>Cine Studio</h1><label>Film <select id="film" aria-label="Film"></select></label><span class="badge" id="engine">—</span>
  <label>Preview <select id="res" aria-label="Preview size"><option value="270">270p</option><option value="360" selected>360p</option><option value="540">540p</option><option value="720">720p</option></select></label>
  <button id="check" title="Measure cameras, lens clearance and holds for every shot">Check film</button><button id="insp" title="Look at the shot from any side: drag on the picture to go round it, wheel to move in and out, double-click to come back (I)">Inspect</button><button id="snap" title="Keep the frame on screen as a picture in the film's out folder">Save frame</button><button id="cap" title="Motion capture from an ordinary video of a person: choose the video, and a clip the rig can play is saved in this film's folder">Capture motion…</button><input id="capf" type="file" accept="video/*" style="display:none"><select id="rend" aria-label="Render"><option value="">Render…</option><option value="720">Preview 720p</option><option value="full">Full size</option><option value="stop">Stop the render</option></select><label><input type="checkbox" id="g"> Guides</label><span class="sp"></span><span id="status" role="status" aria-live="polite">Loading…</span></header>
<main>
  <section><div class="tabs" role="tablist"><button id="tShots" class="on" role="tab">Shots</button><button id="tLib" role="tab">Library</button></div><div class="list" id="shots"></div><div class="list" id="lib" style="display:none"></div></section>
  <section><div id="stage"><div id="view"><canvas id="guides"></canvas></div><div id="busy">Building the shot…</div></div><div id="marks"></div>
    <div id="bar"><button id="play" class="pri" aria-label="Play or pause">▶ Play</button><input id="seek" type="range" min="0" max="1" step="0.001" value="0" aria-label="Time"><select id="speed" aria-label="Speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option></select><span id="time">0.00 s</span></div>
    <div id="under"><div id="live" style="display:none"><canvas id="lf"></canvas><div><h3>Render in progress</h3><div id="lp"></div></div></div><div id="tune"></div><div id="rev"></div></div></section>
  <section><div id="codebar"><select id="file" aria-label="File"></select><button id="edit" title="Change the code here; saving reloads the picture (the old file is kept)">Edit</button><button id="save" class="pri" style="display:none" title="Save (Ctrl+S)">Save</button><button id="undo" title="Put back the file as it was before the last save from here">Undo save</button><span class="sp"></span><span class="badge" id="saved">—</span></div><pre id="code" tabindex="0" aria-label="Code"></pre><textarea id="ta" spellcheck="false" aria-label="Code editor" style="display:none"></textarea></section>
</main>
<script type="module">
// CINE STUDIO — a film of Cine / CodeScape / Clay playing live on the graphics card, with the code that makes it beside it.
// Change a file (by hand, or Claude through cine.write) and the picture follows by itself. The Library tab is everything the film can use.
const $ = id => document.getElementById(id), q = new URLSearchParams(location.search), esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const api = async p => { const r = await fetch(p, { cache: 'no-store' }); if (!r.ok) throw new Error(`${p}: ${r.status}`); return r.json(); };
const KEY = q.get('k') || '';
const send = async (p, body, type) => { const r = await fetch(p, { method: 'POST', headers: { 'X-Studio-Key': KEY, ...(type ? { 'Content-Type': type } : {}) }, body }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || `not done (${r.status})`); return j; };
const say = (t, bad) => { $('status').textContent = t; $('status').style.color = bad ? 'var(--bad)' : ''; };
let insp = { on: false, yaw: 0, pitch: 0, zoom: 1 }, editing = false, tuned = {};
let film = q.get('film') || '', base = '', ENG = null, K = null, FILM = null, order = [], starts = [], total = 0, cur = -1, E = null, ctx = null, canvas = null, playing = false, T = +(q.get('t') || 0), stamp = 0, audio = null, clock0 = 0, building = false, srcText = '', srcFile = 'film.js', drawn = 0, fpsT = performance.now(), aspect = 16 / 9;
addEventListener('error', e => say('Mistake: ' + (e.message || 'a file did not load') + (e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno : ''), true));
addEventListener('unhandledrejection', e => say('Mistake: ' + (e.reason && e.reason.message || e.reason), true));

async function boot() { const L = await api('/studio/films'); $('film').innerHTML = L.films.map(f => `<option value="${esc(f.name)}">${f.library ? 'Library (people, hands, holds)' : esc(f.name)}</option>`).join(''); if (!film || !L.films.some(f => f.name === film)) film = (L.films.find(f => !f.library) || L.films[0]).name; $('film').value = film; $('res').value = q.get('res') || localStorage.cineRes || '360'; $('g').checked = localStorage.cineGuides === '1';
  base = `/f/${encodeURIComponent(film)}/`; { const b = document.createElement('base'); b.href = base; document.head.appendChild(b); } /* the film's own relative fetches (fonts, textures, data) resolve in its folder, then the shared assets, then its engine */ const st = await api('/studio/stat?film=' + encodeURIComponent(film)); stamp = st.newest; $('engine').textContent = st.engine; $('file').innerHTML = st.files.map(f => `<option>${esc(f.name)}</option>`).join('');
  say('Loading the film\'s code…'); ENG = await import(base + 'engine.js'); K = await import(base + 'kit.js'); FILM = await import(base + 'film.js');
  const M = FILM.META || {}; order = (M.order || Object.keys(FILM.S)).filter(id => FILM.S[id]); starts = []; total = 0; for (const id of order) { starts.push(total); total += FILM.S[id].dur; } aspect = (M.width || 2560) / (M.height || 1440);
  $('seek').max = total; $('marks').innerHTML = starts.slice(1).map(s => `<i style="left:${(s / total * 100).toFixed(3)}%"></i>`).join('');
  $('shots').innerHTML = order.map((id, i) => `<div class="row" tabindex="0" data-i="${i}"><span class="t">${FILM.S[id].dur.toFixed(1)} s</span><b>${esc(id)}</b><small>${esc(FILM.S[id].about || '')}</small></div>`).join('');
  if (st.audio) { audio = new Audio(base + (M.audio || 'audio.wav') + '?v=' + st.audio); audio.preload = 'auto'; }
  await showFile(q.get('file') || 'film.js'); if (q.get('edit') === '1') setEdit(true); loadLibrary(); tuneUI(); T = Math.min(Math.max(0, T), Math.max(0, total - 0.05)); await seekTo(T, true); say(`${order.length} shots · ${total.toFixed(1)} s · ${M.width || '?'}×${M.height || '?'} — space plays, ← → step a frame, ↑ ↓ change shot`); if (q.get('play') === '1') toggle(true); setInterval(watch, 1500); requestAnimationFrame(loop); if (q.get('check') === '1') runCheck(); if (q.get('tab') === 'lib') tab(true); }

function size() { const h = +$('res').value, pr = aspect < 1 ? [Math.round(h * 1), Math.round(h / aspect)] : [Math.round(h * aspect), h]; return aspect < 1 ? [h, Math.round(h / aspect)] : pr; }
async function build(i) { building = true; $('busy').style.display = 'block'; await new Promise(r => setTimeout(r, 15));
  try { if (E) { try { E.renderer.dispose(); E.renderer.forceContextLoss && E.renderer.forceContextLoss(); } catch (e) { } } if (canvas) canvas.remove(); const [W, H] = size(); canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H; $('view').prepend(canvas); $('view').style.aspectRatio = `${W} / ${H}`;
    E = new ENG.Engine(canvas, W, H); await K.init(E); const sh = FILM.S[order[i]]; E.soft = typeof sh.soft === 'function' ? sh.soft(0) : !!sh.soft; ctx = await sh.build(E); cur = i;
    document.querySelectorAll('#shots .row').forEach((r, k) => r.classList.toggle('on', k === i)); const on = document.querySelector('#shots .row.on'); if (on) on.scrollIntoView({ block: 'nearest' }); markCode(); drawGuides(); }
  finally { building = false; $('busy').style.display = 'none'; } }
/** the shot seen from elsewhere: the lens goes round its own aim point (Inspect) — for looking at a hand or a pose from every side */
function around(cam) { const p = cam.p, t = cam.t, dx = p[0] - t[0], dy = p[1] - t[1], dz = p[2] - t[2], d = Math.hypot(dx, dy, dz) || 1, r = d * insp.zoom, yaw = Math.atan2(dx, dz) + insp.yaw, pit = Math.max(-1.5, Math.min(1.5, Math.asin(dy / d) + insp.pitch)); return { ...cam, p: [t[0] + r * Math.cos(pit) * Math.sin(yaw), t[1] + r * Math.sin(pit), t[2] + r * Math.cos(pit) * Math.cos(yaw)], dof: 0, fade: 1 }; }
function shotAt(t) { let i = order.length - 1; while (i > 0 && starts[i] > t + 1e-6) i--; return i; }
function draw() { if (!E || cur < 0) return; const sh = FILM.S[order[cur]], t = Math.min(Math.max(0, T - starts[cur]), sh.dur - 1e-4); let cam = sh.frame(t, ctx, E); if (insp.on) cam = around(cam); E.setCam(cam); E.render(t + (sh.t0 || 0)); drawn++;
  $('seek').value = T; const now = performance.now(); if (now - fpsT > 500) { $('time').textContent = `${order[cur]} ${t.toFixed(2)} · ${T.toFixed(2)} / ${total.toFixed(1)} s · ${Math.round(drawn * 1000 / (now - fpsT))} fps`; drawn = 0; fpsT = now; } }
async function seekTo(t, force) { T = Math.min(Math.max(0, t), Math.max(0, total - 1e-3)); const i = shotAt(T); if (i !== cur || force) { const was = playing; if (was && audio) audio.pause(); await build(i); if (was) startClock(); } draw(); }
function startClock() { clock0 = performance.now() - T * 1000 / +$('speed').value; if (audio) { audio.playbackRate = +$('speed').value; audio.currentTime = T; audio.play().catch(() => { }); } }
function toggle(on) { playing = on ?? !playing; $('play').textContent = playing ? '⏸ Pause' : '▶ Play'; if (playing) { if (T >= total - 0.05) T = 0; startClock(); } else if (audio) audio.pause(); }
async function loop() { if (playing && !building) { const sp = +$('speed').value; let t = audio && !audio.paused ? audio.currentTime : (performance.now() - clock0) / 1000 * sp; if (t >= total) { t = 0; T = 0; startClock(); } if (shotAt(t) !== cur) await seekTo(t); else { T = t; draw(); } } requestAnimationFrame(loop); }
function drawGuides() { const g = $('guides'), on = $('g').checked; g.style.display = on ? 'block' : 'none'; if (!on || !canvas) return; g.width = canvas.width; g.height = canvas.height; const c = g.getContext('2d'), W = g.width, H = g.height; c.clearRect(0, 0, W, H); c.strokeStyle = 'rgba(255,255,255,.35)'; c.setLineDash([6, 6]); c.strokeRect(W * 0.05, H * 0.05, W * 0.9, H * 0.9); c.strokeStyle = 'rgba(255,180,84,.8)'; c.beginPath(); c.moveTo(0, H * 0.835); c.lineTo(W, H * 0.835); c.stroke(); c.setLineDash([]); c.fillStyle = 'rgba(255,180,84,.9)'; c.font = `${Math.max(10, W * 0.028)}px system-ui`; c.fillText('subtitles', 6, H * 0.835 - 5); c.strokeStyle = 'rgba(255,255,255,.18)'; for (const k of [1 / 3, 2 / 3]) { c.beginPath(); c.moveTo(W * k, 0); c.lineTo(W * k, H); c.moveTo(0, H * k); c.lineTo(W, H * k); c.stroke(); } }

// ---- the code
const TOK = /(\/\/.*$)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`)|\b(const|let|var|function|return|if|else|for|while|of|in|new|import|export|from|async|await|class|this|true|false|null|undefined)\b|\b(\d+\.?\d*)\b/g;
function paint(line) { let out = '', i = 0, m; TOK.lastIndex = 0; while ((m = TOK.exec(line))) { out += esc(line.slice(i, m.index)); const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'k' : 'n'; out += `<span class="${cls}">${esc(m[0])}</span>`; i = m.index + m[0].length; if (m[1]) break; } return out + esc(line.slice(i)); }
async function showFile(name) { srcFile = name; if (![...$('file').options].some(o => o.value === name)) $('file').add(new Option(name, name)); $('file').value = name; const r = await fetch(`/studio/text?film=${encodeURIComponent(film)}&file=${encodeURIComponent(name)}`, { cache: 'no-store' }); srcText = r.ok ? await r.text() : `// ${name}: not found`; const lines = srcText.split('\n'); $('code').innerHTML = lines.map(l => `<div>${l.length > 4000 ? esc(l.slice(0, 4000)) + ' …' : paint(l)}</div>`).join(''); $('saved').textContent = `${name} · ${lines.length} lines`; markCode(); }
function markCode() { if (srcFile !== 'film.js' || cur < 0) return; const id = order[cur], rows = $('code').children, lines = srcText.split('\n'); let a = lines.findIndex(l => new RegExp(`^\\s*S\\.${id}\\s*=|^\\s*S\\[['"]${id}['"]\\]\\s*=`).test(l)); for (const r of rows) r.className = ''; if (a < 0) return; let b = a + 1; while (b < lines.length && !/^\s*S(\.[A-Za-z_$][\w$]*|\[['"][^'"]+['"]\])\s*=/.test(lines[b]) && !/^\/\/ ={8,}/.test(lines[b])) b++; if (a > 0 && /^\s*\/\//.test(lines[a - 1])) a--; for (let i = a; i < b && i < rows.length; i++) rows[i].className = i === a ? 'head' : 'hot'; rows[a].scrollIntoView({ block: 'start' }); }
async function loadLibrary() { try { const L = await api('/studio/library?film=' + encodeURIComponent(film)); $('lib').innerHTML = L.modules.map(m => `<div class="mod" tabindex="0" data-f="${esc(m.file)}">${esc(m.file)} <span>· ${m.where} · ${m.items.length}</span></div>` + m.items.map(it => `<div class="row item" data-f="${esc(m.file)}" data-n="${esc(it.name)}"><button class="cp" data-imp="import { ${esc(it.name)} } from './${esc(m.file)}';" title="Copy the import line for a film">copy import</button><code>${esc(it.name)}${esc(it.args || '')}</code><small>${esc(it.doc || it.kind)}</small></div>`).join('')).join(''); } catch (e) { $('lib').textContent = 'The library could not be listed: ' + e.message; } }

// ---- live: files that change reload the picture; a render that is running is shown as it is drawn
async function watch() { let st; try { st = await api('/studio/stat?film=' + encodeURIComponent(film)); } catch (e) { return; }
  if (st.newest > stamp) { say('The code changed — loading it…'); if (editing && $('ta').value !== srcText) { say('The file changed on disk while you are editing it — save or leave Edit to load it'); return; } const u = new URLSearchParams({ k: KEY, film, t: T.toFixed(3), res: $('res').value, play: playing ? '1' : '0', file: srcFile, ...(editing ? { edit: '1' } : {}) }); location.replace('/studio.html?' + u); return; }
  const r = st.render || {}, live = r.state === 'drawing' || r.state === 'joining'; $('live').style.display = live ? 'flex' : 'none'; if (live || $('rev').innerHTML) $('under').style.display = 'block';
  if (live) { $('lp').innerHTML = `${esc(r.film || '')} · ${esc(r.size || '')} @ ${r.fps || ''} fps · ${esc(r.encoder || '')}<br>pieces ${esc(r.pieces || '')} · piece ${esc(r.piece || '')}<br>${r.framesPerSecond || 0} frames a second${r.left ? ' · about ' + esc(r.left) + ' left' : ''}`; if (st.frame && st.frame.age < 20000) { try { const f = await fetch('/studio/lastframe', { cache: 'no-store' }); if (f.ok) { const [w, h] = f.headers.get('X-Size').split('x').map(Number), px = new Uint8ClampedArray(await f.arrayBuffer()); const c = $('lf'), s = Math.max(1, Math.round(h / 300)); c.width = Math.floor(w / s); c.height = Math.floor(h / s); const g = c.getContext('2d'), im = g.createImageData(c.width, c.height); for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) { const o = ((h - 1 - y * s) * w + x * s) * 4, d = (y * c.width + x) * 4; im.data[d] = px[o]; im.data[d + 1] = px[o + 1]; im.data[d + 2] = px[o + 2]; im.data[d + 3] = 255; } g.putImageData(im, 0, 0); } } catch (e) { } } } }
async function runCheck() { $('under').style.display = 'block'; $('rev').innerHTML = '<h3>Checking the film…</h3>'; const { reviewFilm } = await import('/review.js'); const mk = () => { const c = document.createElement('canvas'); c.width = 64; c.height = 64; return new ENG.Engine(c, 64, 64); }; const rows = [];
  const R = await reviewFilm(FILM, mk, ENG.V3, { onShot: s => { const ok = s.camera.ok && s.lens.ok && s.holds.every(h => h.ok) && (s.bodies || []).every(b => b.ok); rows.push(`<tr class="row" data-i="${order.indexOf(s.id)}" data-t="${!s.camera.ok ? s.camera.at : 0}"><td class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'}</td><td><b>${esc(s.id)}</b></td><td class="${s.camera.ok ? '' : 'bad'}">camera ${s.camera.shakePx} px</td><td class="${s.lens.ok ? '' : 'bad'}">${s.lens.nearestCm > 800 ? '' : 'nearest ' + s.lens.nearestCm + ' cm'}</td><td>${s.holds.map(h => `<span class="${h.ok ? '' : 'bad'}">${esc(h.name)}: reach ${h.reachPct}% · wrist ${h.wristDeg}° · gap ${h.gapMm} mm</span>`).concat((s.bodies || []).filter(b => !b.ok).map(b => `<span class="bad">${esc(b.name)}: feet ${b.slideMm} mm a frame · leg ${b.legPct}% · off ${b.offCm} cm</span>`)).join('<br>')}</td></tr>`); $('rev').innerHTML = `<h3>Checking… ${rows.length}/${order.length}</h3><table>${rows.join('')}</table>`; } });
  $('rev').innerHTML = `<h3 class="${R.ok ? 'ok' : 'bad'}">${R.ok ? 'Review: clean — steady cameras, clear lenses, hands that hold' : 'Review: ' + R.must.length + ' to fix'}</h3><table>${rows.join('')}</table>${R.must.map(m => `<div class="bad">• ${esc(m)}</div>`).join('')}`; }

// ---- controls
$('play').onclick = () => toggle(); $('seek').oninput = e => { if (audio && playing) audio.currentTime = +e.target.value; clock0 = performance.now() - +e.target.value * 1000 / +$('speed').value; seekTo(+e.target.value); }; $('speed').onchange = () => { if (playing) startClock(); };
$('res').onchange = () => { localStorage.cineRes = $('res').value; seekTo(T, true); }; $('g').onchange = () => { localStorage.cineGuides = $('g').checked ? '1' : '0'; drawGuides(); }; $('film').onchange = () => { location.replace('/studio.html?' + new URLSearchParams({ k: KEY, film: $('film').value })); }; $('file').onchange = async () => { if (editing && $('ta').value !== srcText && !confirmLeave()) { $('file').value = srcFile; return; } await showFile($('file').value); if (editing) { $('ta').value = srcText; $('ta').scrollTop = 0; } }; $('check').onclick = runCheck;
$('shots').onclick = e => { const r = e.target.closest('.row'); if (r) { if (srcFile !== 'film.js') showFile('film.js'); seekTo(starts[+r.dataset.i] + 1e-3, true); } }; $('rev').onclick = e => { const r = e.target.closest('tr.row'); if (r && +r.dataset.i >= 0) seekTo(starts[+r.dataset.i] + (+r.dataset.t || 0) + 1e-3, true); };
$('lib').onclick = e => { const cp = e.target.closest('[data-imp]'); if (cp) { navigator.clipboard.writeText(cp.dataset.imp).then(() => say('Copied: ' + cp.dataset.imp), () => say(cp.dataset.imp)); return; } const r = e.target.closest('[data-f]'); if (!r) return; showFile(r.dataset.f).then(() => { if (!r.dataset.n) return; const i = srcText.split('\n').findIndex(l => new RegExp(`export\\s+(async\\s+)?(function|const|class)\\s+${r.dataset.n}\\b`).test(l)); if (i >= 0) { const d = $('code').children[i]; d.className = 'head'; d.scrollIntoView({ block: 'center' }); } }); };
const tab = lib => { $('tShots').classList.toggle('on', !lib); $('tLib').classList.toggle('on', lib); $('shots').style.display = lib ? 'none' : ''; $('lib').style.display = lib ? '' : 'none'; }; $('tShots').onclick = () => tab(false); $('tLib').onclick = () => tab(true);
addEventListener('keydown', e => { if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.target.id !== 'seek') return; const f = 1 / ((FILM && FILM.META && FILM.META.fps) || 30); if (e.code === 'Space') { e.preventDefault(); toggle(); } else if (e.key === 'ArrowRight') { e.preventDefault(); toggle(false); seekTo(T + f); } else if (e.key === 'ArrowLeft') { e.preventDefault(); toggle(false); seekTo(T - f); } else if (e.key === 'ArrowDown') { e.preventDefault(); seekTo(starts[Math.min(order.length - 1, cur + 1)] + 1e-3, true); } else if (e.key === 'ArrowUp') { e.preventDefault(); seekTo(starts[Math.max(0, cur - 1)] + 1e-3, true); } else if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('row')) e.target.click(); });
// ---- editing: the code, the numbers, a kept frame, a render
/** unsaved typing is never thrown away without a word: the first try says so, the second (within 4 s) goes ahead */
let leaveAt = 0; function confirmLeave() { if (performance.now() - leaveAt < 4000) return true; leaveAt = performance.now(); say('You have unsaved changes in ' + srcFile + ' — save them (Ctrl+S), or choose again to leave them', true); return false; }
function setEdit(on) { if (!on && editing && $('ta').value !== srcText && !confirmLeave()) return; editing = on; $('edit').classList.toggle('on', on); $('save').style.display = on ? '' : 'none'; $('ta').style.display = on ? '' : 'none'; $('code').style.display = on ? 'none' : ''; if (on) { const top = $('code').scrollTop; $('ta').value = srcText; $('ta').focus(); $('ta').setSelectionRange(0, 0); $('ta').scrollTop = top; } else showFile(srcFile); }
async function saveFile() { if (film === '@library') return say('The Library is the app\'s own: copy what you need into a film.', true); try { const r = await send(`/studio/write?film=${encodeURIComponent(film)}&file=${encodeURIComponent(srcFile)}`, $('ta').value, 'text/plain'); srcText = $('ta').value; say(`Saved ${r.file} (${r.bytes} bytes; the earlier one is kept) — loading it…`); } catch (e) { say('Not saved: ' + e.message, true); } }
function tuneUI() { const TU = FILM.TUNE; if (!TU || typeof TU !== 'object') return; const keys = Object.keys(TU).filter(k => typeof TU[k] === 'number'); if (!keys.length) return; $('under').style.display = 'block';
  $('tune').innerHTML = '<div class="wide"><b>Live numbers</b><span style="color:var(--dim)">from the film\'s <code>export const TUNE</code> — move one and the picture follows</span><span class="sp" style="flex:1"></span><button id="tw" class="pri" disabled>Write to film.js</button></div>' + keys.map(k => { const v = TU[k], span = Math.max(Math.abs(v), 0.05), lo = v >= 0 ? Math.max(0, v - span) : v - span, hi = v + span; return `<label>${esc(k)}<input type="range" data-k="${esc(k)}" min="${lo}" max="${hi}" step="${(hi - lo) / 400}" value="${v}"><output>${+v.toFixed(3)}</output></label>`; }).join('');
  $('tune').oninput = e => { const k = e.target.dataset.k; if (!k) return; TU[k] = +e.target.value; tuned[k] = TU[k]; e.target.nextElementSibling.textContent = (+e.target.value).toFixed(3); $('tw').disabled = false; if (!playing) draw(); };
  $('tw').onclick = async () => { try { const r = await send('/studio/tune?film=' + encodeURIComponent(film), JSON.stringify(tuned), 'application/json'); say(`${r.set} number${r.set === 1 ? '' : 's'} written into film.js`); tuned = {}; } catch (e) { say('Not written: ' + e.message, true); } }; }
$('edit').onclick = () => setEdit(!editing); $('save').onclick = saveFile; $('undo').onclick = async () => { try { const r = await send(`/studio/undo?film=${encodeURIComponent(film)}&file=${encodeURIComponent(srcFile)}`, ''); say(`${r.file} is back as it was (${r.left} earlier cop${r.left === 1 ? 'y' : 'ies'} left)`); if (editing) { editing = false; } } catch (e) { say(e.message, true); } };
$('ta').addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(); } else if (e.key === 'Tab') { e.preventDefault(); const t = e.target, a = t.selectionStart; t.setRangeText('  ', a, t.selectionEnd, 'end'); } e.stopPropagation(); });
$('insp').onclick = () => { insp.on = !insp.on; if (!insp.on) insp = { on: false, yaw: 0, pitch: 0, zoom: 1 }; $('insp').classList.toggle('on', insp.on); $('view').classList.toggle('insp', insp.on); draw(); };
{ let drag = null; const vw = $('view'); vw.addEventListener('pointerdown', e => { if (!insp.on) return; drag = [e.clientX, e.clientY, insp.yaw, insp.pitch]; vw.setPointerCapture(e.pointerId); }); vw.addEventListener('pointermove', e => { if (!drag) return; insp.yaw = drag[2] - (e.clientX - drag[0]) * 0.0045; insp.pitch = drag[3] + (e.clientY - drag[1]) * 0.0035; if (!playing) draw(); }); vw.addEventListener('pointerup', () => { drag = null; }); vw.addEventListener('wheel', e => { if (!insp.on) return; e.preventDefault(); insp.zoom = Math.max(0.15, Math.min(6, insp.zoom * Math.exp(e.deltaY * 0.0012))); if (!playing) draw(); }, { passive: false }); vw.addEventListener('dblclick', () => { if (!insp.on) return; insp.yaw = insp.pitch = 0; insp.zoom = 1; draw(); }); }
$('snap').onclick = () => { if (!canvas || cur < 0) return; draw(); canvas.toBlob(async b => { try { const r = await send(`/studio/snap?film=${encodeURIComponent(film)}&shot=${encodeURIComponent(order[cur])}&t=${(T - starts[cur]).toFixed(2)}`, b, 'image/png'); say('Frame kept: ' + r.file); } catch (e) { say('Not kept: ' + e.message, true); } }, 'image/png'); };
$('rend').onchange = async () => { const v = $('rend').value; $('rend').value = ''; if (!v) return; try { if (v === 'stop') { await send('/studio/stop?film=' + encodeURIComponent(film), ''); return say('Stopping the render…'); } const M = FILM.META || {}, W0 = M.width || 2560, H0 = M.height || 1440, k = v === 'full' ? 1 : 720 / Math.min(W0, H0); const W = Math.round(W0 * k / 2) * 2, H = Math.round(H0 * k / 2) * 2; toggle(false); const r = await send(`/studio/render?film=${encodeURIComponent(film)}&width=${W}&height=${H}&fps=${M.fps || 30}`, ''); $('under').style.display = 'block'; say(`Rendering ${W}×${H} on the graphics card (${r.encoder || ''}) — it is shown below as it is drawn; the file goes to Videos/VideoStudio`); } catch (e) { say('The render did not start: ' + e.message, true); } };
addEventListener('keydown', e => { if (!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.key.toLowerCase() === 'i') $('insp').click(); });
// motion capture: a video of a person → a clip in the film's folder (the server finds the body in every frame; a minute of video takes a few minutes)
$('cap').onclick = () => { if (film === '@library') return say('Open one of your films first: the clip is saved into the film\'s folder.', true); $('capf').value = ''; $('capf').click(); };
$('capf').onchange = async () => { const f = $('capf').files[0]; if (!f) return; $('cap').disabled = true; const t0 = performance.now(); const tick = setInterval(() => say(`Finding the body in every frame of ${f.name}… ${Math.round((performance.now() - t0) / 1000)} s (the first time, the capture sets up its own tools: a few minutes and about 300 MB, once)`), 1000);
  try { const r = await send(`/studio/mocap?film=${encodeURIComponent(film)}&name=${encodeURIComponent(f.name)}`, f, 'application/octet-stream'); clearInterval(tick); try { await navigator.clipboard.writeText(r.use); } catch (e) { /* no clipboard */ }
    say(`Captured ${r.seconds} s (${r.frames} frames) → ${r.clip} in this film's folder. ${r.note || ''} How to play it is copied: paste it into film.js.`); $('under').style.display = 'block'; $('rev').innerHTML = `<div class="row"><b>${esc(r.clip)}</b> — ${r.seconds} s of captured motion${r.legs === false ? ' (waist up: the legs stand)' : ''}<br><code>${esc(r.use)}</code></div>` + $('rev').innerHTML; }
  catch (e) { clearInterval(tick); say('No capture: ' + e.message, true); } finally { $('cap').disabled = false; } };
boot().catch(e => say('Cine Studio could not start: ' + e.message, true));
</script></body></html>
