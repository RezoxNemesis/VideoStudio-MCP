name: Studio device evidence

on:
  pull_request:
    branches: [main]
    paths: ['android/**', '.github/workflows/studio-emulator.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: videostudio-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install compile SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' >/dev/null
      - name: Build instrumentation APK
        working-directory: android
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Exercise editor and native render on API 33
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p artifacts/device-evidence
            adb logcat -c
            trap 'adb pull /sdcard/Android/data/com.rezoxnemesis.videostudio/files/evidence artifacts/device-evidence; adb logcat -d > artifacts/device-evidence/logcat.txt' EXIT
            gradle -p android :app:connectedDebugAndroidTest --stacktrace
      - name: Upload device screenshots, renders and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoStudio-device-evidence
          path: |
            artifacts/device-evidence
            android/app/build/outputs/androidTest-results/connected
            android/app/build/reports/androidTests/connected
          if-no-files-found: warn
