name: Native Kinetic Benchmark CI

on:
  push:
    branches:
      - feature/kinetic-motion-engine-20261024
      - feature/kinetic-shape-compositor-v41027
      - feature/ae-masks-responsive-studio-20261024
      - feature/ae-bezier-motion-graph-20261024
      - feature/ae-parent-motion-groups-v41030
      - feature/ae-touch-curve-editor-v41031
  pull_request:
    branches:
      - feat/native-preview-audio-import-20261024
      - feature/kinetic-motion-engine-20261024

concurrency:
  group: kinetic-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kinetic-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android API 36 platform
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/package.xml" ]; then
            timeout 240s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null'
          fi
          test -f "$ANDROID_HOME/platforms/android-36/package.xml"

      - name: Compile Android and run complete native unit suite
        working-directory: android
        run: |
          set -euo pipefail
          gradle :app:compileDebugJavaWithJavac :app:testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-native-tests
          retention-days: 7
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/

      # Owner's debug-signing key is intentionally NOT recreated here.
      # An installable APK requires the repository's pinned signing identity.
