name: OMEGA All-Phase Premerge Android Proof
on:
  push:
    branches:
      - review/omega-nine-phase-integration-20261020
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-premerge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combined-native-compile-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK platform 36
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          if [ ! -f "$ANDROID_HOME/platforms/android-36/package.xml" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            timeout 240s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null'
          fi
          test -f "$ANDROID_HOME/platforms/android-36/package.xml"
      - name: Verify exact OMEGA eight phase engines present
        shell: bash
        run: |
          set -euo pipefail
          for cls in OmegaMasterDependencyIndex OmegaReferenceGeometry OmegaBezierFitter OmegaTwoBoneIK OmegaMotionTimeline OmegaVisualAudit OmegaAudioTimeline OmegaRenderPlan; do
            test -f "android/app/src/main/java/com/rezoxnemesis/videostudio/$cls.java"
            test -f "android/app/src/test/java/com/rezoxnemesis/videostudio/${cls}Test.java"
          done
      - name: Compile and run ALL Android unit regressions
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:compileDebugJavaWithJavac :app:testDebugUnitTest --stacktrace
      - name: Preserve XML test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-all-phase-premerge-junit
          retention-days: 14
          if-no-files-found: warn
          path: android/app/build/test-results/testDebugUnitTest/
