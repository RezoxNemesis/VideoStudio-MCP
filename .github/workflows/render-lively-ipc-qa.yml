name: VideoStudio production carrier APK
on:
  push:
    branches: [feature/render-production-carrier-20261022]
    paths: ["android/**", "tools/prepare_production_carrier.py", ".github/workflows/render-lively-ipc-qa.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: videostudio-production-carrier-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-bridge-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Align native protocol and APK versions
        run: python3 tools/prepare_production_carrier.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore established VideoStudio signing key
        uses: actions/cache/restore@v4
        id: signer
        with:
          path: ~/.android/debug.keystore
          key: videostudio-android-debug-signing-v1
          fail-on-cache-miss: true
      - name: Refuse signing identity changes
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.signer.outputs.cache-hit }}" = "true"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > "$RUNNER_TEMP/carrier-keystore-proof.txt"
          grep -Fq '7E:01:87:47:03:56:61:6B:E2:A4:5B:C7:F4:14:45:89:40:85:18:5D:B1:10:ED:FD:C0:CD:FD:23:29:42:A6:DD' "$RUNNER_TEMP/carrier-keystore-proof.txt"
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Run Android regression tests and compile carrier
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify installed identity, manifest version and final APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -tqq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/carrier-apk-signature.txt"
          grep -Fqi '7e0187470356616be2a45bc7f41445894085185db110edfdc0cdfd232942a6dd' "$RUNNER_TEMP/carrier-apk-signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/carrier-apk-badging.txt"
          grep -Fq "name='com.rezoxnemesis.videostudio'" "$RUNNER_TEMP/carrier-apk-badging.txt"
          grep -Fq "versionCode='355'" "$RUNNER_TEMP/carrier-apk-badging.txt"
          grep -Fq 'APP_VERSION = "3.5.5"' android/app/src/main/java/com/rezoxnemesis/videostudio/AppProtocol.java
          cp "$APK" "$RUNNER_TEMP/VideoStudio-3.5.5-Render-Production-Carrier.apk"
          sha256sum "$RUNNER_TEMP/VideoStudio-3.5.5-Render-Production-Carrier.apk" > "$RUNNER_TEMP/carrier-apk-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: VideoStudio-3.5.5-Render-Production-Carrier
          path: ${{ runner.temp }}/VideoStudio-3.5.5-Render-Production-Carrier.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VideoStudio-3.5.5-carrier-test-and-signature-proof
          path: |
            android/app/build/test-results/testDebugUnitTest/
            ${{ runner.temp }}/carrier-apk-signature.txt
            ${{ runner.temp }}/carrier-apk-badging.txt
            ${{ runner.temp }}/carrier-apk-sha256.txt
          retention-days: 14
