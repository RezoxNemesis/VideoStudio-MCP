name: VideoStudio CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax and source smoke checks
        run: |
          node --check src/index.js
          npm test

      - name: Cloudflare dry-run build
        run: npx wrangler deploy --dry-run --outdir .wrangler-dist

