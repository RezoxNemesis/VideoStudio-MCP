name: Native Edited Preview Recovery CI

on:
  push:
    branches:
      - integration/native-edit-preview-large-upgrade-20261025
  pull_request:
    branches:
      - feat/native-canvas-vfx-20261025

permissions:
  contents: read

concurrency:
  group: edited-preview-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-preview-implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK API 36
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/package.xml" ]; then
            timeout 240s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null'
          fi
          test -f "$ANDROID_HOME/platforms/android-36/package.xml"
      - name: Check timeline compositing and preview resource ownership first
        working-directory: android
        run: |
          set -euo pipefail
          gradle :app:compileDebugJavaWithJavac :app:testDebugUnitTest --tests com.rezoxnemesis.videostudio.StudioVirtualizedTitleOverlayTest --tests com.rezoxnemesis.videostudio.StudioTimedTitleOverlayTest --no-daemon --stacktrace --console=plain
      - name: Complete native regression suite
        working-directory: android
        run: |
          gradle :app:testDebugUnitTest --no-daemon --stacktrace --console=plain
      - name: Test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-preview-recovery-native-unit-tests
          retention-days: 7
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
