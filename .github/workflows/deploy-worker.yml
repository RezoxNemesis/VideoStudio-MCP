name: Deploy Studio Web Worker

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "scripts/bake-relay-build.mjs"
      - "scripts/bake-personal-client.mjs"
      - "scripts/verify-relay-release.mjs"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare deploy credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Worker deployment is BLOCKED: existing Cloudflare account/token bindings are required. No deployment occurred."
            exit 1
          fi

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Validate Studio Web
        run: npm test

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Verify deployed source and storage identity
        run: node scripts/verify-relay-release.mjs https://wispy-queen-f9b5.prakasharuntandon634.workers.dev
