name: Sketch Linked Masters Phase 1 QA
on:
  push:
    branches:
      - feat/video-studio-master-linked-artwork-p1-20261019
  pull_request:
    branches:
      - release/v486-source-base-20261019
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linked-masters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native-unittests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME"
          if [ ! -f "$sdk/platforms/android-36/package.xml" ] || [ ! -x "$sdk/build-tools/35.0.0/aapt" ]; then
            timeout 240s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null'
          fi
          test -f "$sdk/platforms/android-36/package.xml"
      - name: Compile new vector master runtime and run Android Robolectric tests
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:compileDebugJavaWithJavac --stacktrace
      - name: Upload bounded test XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linked-masters-test-results
          retention-days: 7
          if-no-files-found: warn
          path: android/app/build/test-results/testDebugUnitTest/
