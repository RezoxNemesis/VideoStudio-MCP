name: OMEGA Reference Film Widescreen Native Proof
on:
  push:
    branches: [feature/reference-widescreen-export-20261020]
  pull_request:
    branches: [candidate/omega-4.9.0-cinematic-reference-20261020]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-widescreen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-real-frame-aspect-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          if [ ! -f "$ANDROID_HOME/platforms/android-36/package.xml" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            timeout 240s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null'
          fi
      - name: Enforce real preview / output format parity
        shell: bash
        run: |
          set -euo pipefail
          java=android/app/src/main/java/com/rezoxnemesis/videostudio
          test -s "$java/CinematicOutputFraming.java"
          grep -F 'CinematicOutputFraming.dimensions(outputFraming)' "$java/Cinematic3DStudioActivity.java"
          grep -F 'CinematicOutputFraming.matching(width,height)' "$java/FilamentGlbActivity.java"
          grep -F 'cinematicOutputWidth,cinematicOutputHeight' "$java/FilamentGlbActivity.java"
          test -s android/app/src/test/java/com/rezoxnemesis/videostudio/CinematicOutputFramingTest.java
      - name: Compile Android and run every regression
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:compileDebugJavaWithJavac :app:testDebugUnitTest --stacktrace
      - name: Preserve JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OMEGA-widescreen-cinematic-unit-tests
          retention-days: 14
          if-no-files-found: warn
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
# No signing, Gallery browsing, owner project edits or phone installation.
