name: OMEGA Combined Nine-Phase Integration Smoke
on:
  push:
    branches:
      - integration/omega-nine-phases-20261020
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-combined-slice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combined-additive-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble all eight independent engine slices from pinned phase refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/phase/omega-*:refs/remotes/origin/phase/omega-*'
          src='android/app/src/main/java/com/rezoxnemesis/videostudio'
          testsrc='android/app/src/test/java/com/rezoxnemesis/videostudio'
          phase_branch=(
            phase/omega-1-linked-art
            phase/omega-2-reference-guides
            phase/omega-3-sketch-construction
            phase/omega-4-hybrid-rig
            phase/omega-5-natural-motion
            phase/omega-6-visual-quality
            phase/omega-7-audio-timeline
            phase/omega-8-render-recovery
          )
          class_name=(
            OmegaMasterDependencyIndex
            OmegaReferenceGeometry
            OmegaBezierFitter
            OmegaTwoBoneIK
            OmegaMotionTimeline
            OmegaVisualAudit
            OmegaAudioTimeline
            OmegaRenderPlan
          )
          for i in "${!phase_branch[@]}"; do
            branch="${phase_branch[$i]}"
            cls="${class_name[$i]}"
            printf '%s %s %s\n' "$branch" "$cls" "$(git rev-parse "refs/remotes/origin/$branch")"
            git show "refs/remotes/origin/$branch:$src/$cls.java" > "$src/$cls.java"
            git show "refs/remotes/origin/$branch:$testsrc/${cls}Test.java" > "$testsrc/${cls}Test.java"
          done
          test -f "$src/OmegaRenderPlan.java"
          test -f "$testsrc/OmegaReferenceGeometryTest.java"
          git status --short
      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/package.xml" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            timeout 240s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null'
          fi
          test -f "$ANDROID_HOME/platforms/android-36/package.xml"
      - name: Android compile and all unit regressions with combined sources
        working-directory: android
        run: gradle :app:compileDebugJavaWithJavac :app:testDebugUnitTest --stacktrace
      - name: Keep unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-combined-test-results
          retention-days: 7
          if-no-files-found: warn
          path: android/app/build/test-results/testDebugUnitTest/
