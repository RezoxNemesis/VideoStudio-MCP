name: Sketch Human Agent Smoke

on:
  push:
    branches:
      - feature/sketch-agent-live-reliability-v41041-20261025
      - feature/sketch-human-live-controls-v41041-20261025
      - feature/sketch-visible-brush-agent-v41042-20261025
  pull_request:
    branches:
      - feature/sketch-live-replay-deck-v41040-20261025

concurrency:
  group: sketch-live-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exact-sketch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK 36
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/package.xml" ]; then
            timeout 240s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null'
          fi
          test -f "$ANDROID_HOME/platforms/android-36/package.xml"
      - name: Run source-verified Sketch Studio control and playback tests
        working-directory: android
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace --console=plain \
            --tests '*SketchAgentBrushStageTest' \
            --tests '*SketchEditableXsheetUiTest' \
            --tests '*SketchWritableXsheetTest' \
            --tests '*SketchLiveViewerCommandsTest' \
            --tests '*SketchLiveViewerMcpAdmissionTest' \
            --tests '*SketchPreviewRecoveryTest' \
            --tests '*SketchVisibleXsheetStageTest'
      - name: Preserve failing assertions and XML diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sketch-live-control-smoke
          retention-days: 10
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
