name: OMEGA Nine-Phase Compile and Regression Gate
on:
  pull_request:
    branches:
      - integration/omega-nine-phases-20261020
  push:
    branches:
      - integration/omega-nine-phases-20261020
      - 'phase/omega-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-phase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-compile-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce nine-agent module ownership
        if: github.event_name == 'pull_request'
        env:
          OMEGA_HEAD: ${{ github.event.pull_request.head.sha }}
          OMEGA_BASE: ${{ github.event.pull_request.base.sha }}
          OMEGA_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/omega/check_ownership.py --branch "$OMEGA_BRANCH" --base "$OMEGA_BASE" --head "$OMEGA_HEAD"
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          if [ ! -f "$ANDROID_HOME/platforms/android-36/package.xml" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            timeout 240s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null'
          fi
          test -f "$ANDROID_HOME/platforms/android-36/package.xml"
      - name: Compile native Java and run complete Android unit regressions
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:compileDebugJavaWithJavac :app:testDebugUnitTest --stacktrace
      - name: Save bounded JUnit XML evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-phase-junit-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: android/app/build/test-results/testDebugUnitTest/
