name: Personal Website Verification

on:
  push:
    branches: [main, feat/personal-cloud-studio]
    paths:
      - 'src/personal-*'
      - 'src/studio-character.js'
      - 'src/studio-runtime.js'
      - 'scripts/personal-*'
      - 'scripts/still-character-*'
      - 'scripts/bake-personal-client.mjs'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/personal-website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/personal-*'
      - 'src/studio-character.js'
      - 'src/studio-runtime.js'
      - 'scripts/personal-*'
      - 'scripts/still-character-*'
      - 'scripts/bake-personal-client.mjs'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/personal-website.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: personal-website-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Existing and new backend regression tests
        run: |
          set -o pipefail
          mkdir -p .work
          npm test 2>&1 | tee .work/backend-tests.log
      - name: Reproduce and verify browser bundling regression
        run: node scripts/personal-client-build-test.mjs --bundled
      - name: Production Worker dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler-personal-dist
      - name: Start actual local Cloudflare runtime and seed isolated test identities
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8790 --persist-to .work/wrangler-state > .work/worker.log 2>&1 &
          echo $! > .work/worker.pid
          node scripts/personal-runtime-test.mjs seed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real offline-native MCP integration
        run: node scripts/personal-runtime-test.mjs verify
      - name: Real browser core interactions
        run: |
          set -o pipefail
          python scripts/personal-browser-test.py 2>&1 | tee .work/browser-tests.log
      - name: Verify local character motion in a real browser WebGL context
        run: python scripts/still-character-browser-test.py
      - name: Stable screenshots and preserved editor smoke test
        run: python scripts/personal-capture.py
      - name: Require completed browser evidence
        run: |
          test -s .work/browser-results.json
          test -s .work/character-browser.json
          test -s .work/overview-desktop.png
          test -s .work/overview-mobile.png
          test -s .work/activity-mobile.png
      - name: Stop local Worker
        if: always()
        run: if [ -f .work/worker.pid ]; then kill "$(cat .work/worker.pid)" 2>/dev/null || true; fi
      - name: Source archive
        if: always()
        run: git archive --format=zip --output=VideoStudio-Personal-Source.zip HEAD
      - name: Upload source and actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoStudio-Personal-Verification
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: |
            VideoStudio-Personal-Source.zip
            package-lock.json
            .work/worker.log
            .work/runtime-seed-results.json
            .work/runtime-mcp-results.json
            .work/backend-tests.log
            .work/browser-tests.log
            .work/browser-results.json
            .work/character-browser.json
            .work/editor-smoke-results.json
            .work/overview-desktop.png
            .work/overview-mobile.png
            .work/activity-mobile.png
