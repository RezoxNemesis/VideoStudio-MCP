name: Native Canvas VFX CI

on:
  push:
    branches:
      - feat/native-canvas-vfx-20261025
  pull_request:
    branches:
      - feat/native-glyph-kinetic-editor-20261025

permissions:
  contents: read

concurrency:
  group: native-canvas-vfx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-vfx-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK API 36
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/package.xml" ]; then
            timeout 240s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null'
          fi
          test -f "$ANDROID_HOME/platforms/android-36/package.xml"
      - name: Compile and test real native motion plus existing regressions
        working-directory: android
        run: |
          set -euo pipefail
          gradle :app:compileDebugJavaWithJavac :app:testDebugUnitTest --tests com.rezoxnemesis.videostudio.StudioProceduralVfxTest --no-daemon --stacktrace --console=plain
          gradle :app:testDebugUnitTest --no-daemon --stacktrace --console=plain
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-canvas-vfx-test-evidence
          retention-days: 7
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
