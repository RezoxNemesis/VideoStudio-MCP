name: Native VideoStudio Integrated Upgrade CI

on:
  push:
    branches: [integration/videostudio-offline-big-upgrade-20261026, fix/editor-portrait-return-and-curves-20261026]
  pull_request:
    branches: [integration/native-edit-preview-large-upgrade-20261025, integration/videostudio-offline-big-upgrade-20261026]

permissions:
  contents: read

concurrency:
  group: videostudio-integrated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-editor-and-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/package.xml" ]; then
            timeout 240s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null'
          fi
          test -f "$ANDROID_HOME/platforms/android-36/package.xml"
      - name: Native compilation and focused video regression
        working-directory: android
        run: |
          set -euo pipefail
          gradle :app:compileDebugJavaWithJavac :app:testDebugUnitTest --tests com.rezoxnemesis.videostudio.StudioVirtualizedTitleOverlayTest --tests com.rezoxnemesis.videostudio.NativeOfflineVideoPlanTest --tests com.rezoxnemesis.videostudio.NativeFreshRenderRecoveryTest --tests com.rezoxnemesis.videostudio.StudioProceduralVfxTest --tests com.rezoxnemesis.videostudio.StudioGlyphAnimationTest --tests com.rezoxnemesis.videostudio.StudioCamera2DDirectorTest --tests com.rezoxnemesis.videostudio.StudioEditorWorkspaceConfigurationUiTest --tests com.rezoxnemesis.videostudio.StudioEditorWorkspaceUiTest --tests com.rezoxnemesis.videostudio.StudioKeyframeManagerTest --tests com.rezoxnemesis.videostudio.StudioKeyframeAuthoringTest --tests com.rezoxnemesis.videostudio.EditorPreviewUiTest --tests com.rezoxnemesis.videostudio.NativeOfflineVideoMotionTest --no-daemon --stacktrace --console=plain
      - name: Full native Android regression suite
        working-directory: android
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace --console=plain
      - name: Restore the original VideoStudio signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: videostudio-android-debug-signing-v1
      - name: Verify pinned owner key before candidate APK
        run: |
          set -euo pipefail
          key="$HOME/.android/debug.keystore"
          test -r "$key" || { echo "::error::Owner signing key unavailable; refusing replacement certificate"; exit 1; }
          expected="$(keytool -list -v -keystore "$key" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2;exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$expected" = "7e0187470356616be2a45bc7f41445894085185db110edfdc0cdfd232942a6dd" || {
            echo "::error::Candidate APK signer differs from installed VideoStudio certificate"; exit 1;
          }
      - name: Build owner-signed integrated APK candidate
        working-directory: android
        run: |
          set -euo pipefail
          export VIDEOSTUDIO_SIGNING_KEYSTORE="$HOME/.android/debug.keystore"
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk" > "$apk.sha256"
          actual="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2;exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "7e0187470356616be2a45bc7f41445894085185db110edfdc0cdfd232942a6dd" || {
            echo "::error::Signed candidate APK does not match original owner's cert"; exit 1;
          }
          python3 ../scripts/verify-android-apk.py --apk "$apk" --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Upload owner-compatible candidate (not installed)
        uses: actions/upload-artifact@v4
        with:
          name: VideoStudio-v4.10.44-editor-and-offline-candidate
          retention-days: 7
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Publish unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videostudio-integrated-native-test-reports
          retention-days: 10
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
