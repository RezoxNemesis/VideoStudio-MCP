name: Native VideoStudio Integrated Upgrade CI

on:
  push:
    branches: [integration/videostudio-offline-big-upgrade-20261026]
  pull_request:
    branches: [integration/native-edit-preview-large-upgrade-20261025]

permissions:
  contents: read

concurrency:
  group: videostudio-integrated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-editor-and-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/package.xml" ]; then
            timeout 240s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null'
          fi
          test -f "$ANDROID_HOME/platforms/android-36/package.xml"
      - name: Native compilation and focused video regression
        working-directory: android
        run: |
          set -euo pipefail
          gradle :app:compileDebugJavaWithJavac :app:testDebugUnitTest --tests com.rezoxnemesis.videostudio.StudioVirtualizedTitleOverlayTest --tests com.rezoxnemesis.videostudio.NativeOfflineVideoPlanTest --tests com.rezoxnemesis.videostudio.NativeFreshRenderRecoveryTest --tests com.rezoxnemesis.videostudio.StudioProceduralVfxTest --tests com.rezoxnemesis.videostudio.StudioGlyphAnimationTest --tests com.rezoxnemesis.videostudio.StudioCamera2DDirectorTest --no-daemon --stacktrace --console=plain
      - name: Full native Android regression suite
        working-directory: android
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace --console=plain
      - name: Publish unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videostudio-integrated-native-test-reports
          retention-days: 10
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
