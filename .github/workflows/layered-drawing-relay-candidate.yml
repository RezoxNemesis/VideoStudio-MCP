name: Deploy verified layered drawing relay candidate
on:
  push:
    branches: [feat/native-layered-drawing-v492]
    paths: [.github/workflows/layered-drawing-relay-candidate.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: videostudio-owner-relay-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require existing owner Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Worker deployment BLOCKED: existing Cloudflare token/account bindings are missing. No deployment occurred."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Verify ordinary MCP contracts
        run: npm test
      - name: Prepare exact Worker and retained storage binding
        run: npx wrangler deploy --dry-run
      - name: Deploy to the existing owner Worker
        run: npx wrangler deploy
      - name: Verify deployed source and unchanged storage protocol
        run: node scripts/verify-relay-release.mjs https://wispy-queen-f9b5.prakasharuntandon634.workers.dev
