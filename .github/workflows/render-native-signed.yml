name: Render Native APK — Original VideoStudio Signing Certificate

on:
  push:
    branches: [feature/render-submodule-videostudio-signed-20261022]
  pull_request:
    branches: [feature/render-native-mcp-channel-20261021]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signer-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fail-closed signing configuration unit tests
        run: PYTHONPATH=tools python -m unittest tools/test_render_signed_build.py -v
      - name: Confirm pinned Render source gitlink
        run: |
          grep -Fq 'https://github.com/RezoxNemesis/Render.git' .gitmodules
          test "$(git rev-parse HEAD:render-native)" = "82ba789d9ba067a5b524055f30a379cc50277428"

  build-original-videostudio-signed-render:
    needs: signer-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Verify cloned Render native Android source
        run: |
          test "$(git -C render-native rev-parse HEAD)" = "82ba789d9ba067a5b524055f30a379cc50277428"
          test -s render-native/tools/assemble_full_native.py
          test -s render-native/full-app/scripts/render_agent_startup.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android SDK/NDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Restore original VideoStudio signing keystore — never create new one
        id: vs_signer
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: videostudio-android-debug-signing-v1
          fail-on-cache-miss: true

      - name: Verify exact VideoStudio certificate or abort
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.vs_signer.outputs.cache-hit }}" = "true"
          python -c "import sys;from pathlib import Path;sys.path.insert(0,'tools');from prepare_render_signed_build import inspect_keystore;print('Original VideoStudio signer:', inspect_keystore(Path.home()/'.android/debug.keystore'))"
          echo "VIDEOSTUDIO_SIGNING_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Build pinned Render JNI and Android tests
        run: gradle -p render-native --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Download and verify original full Blender native runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 \
            https://github.com/simfeo/blender/releases/download/android-alpha-4/blender-full.apk \
            -o "$RUNNER_TEMP/blender-full.apk"
          echo "3fe775a1e14470ebfcd3c25ae32b57003433f04552f896880631ae98b1f18aea  $RUNNER_TEMP/blender-full.apk" | sha256sum -c -
          test "$(stat -c%s "$RUNNER_TEMP/blender-full.apk")" = "286561495"

      - name: Fetch pinned original Blender Android launcher and resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/full-blender-src"
          git -C "$RUNNER_TEMP/full-blender-src" init -q
          git -C "$RUNNER_TEMP/full-blender-src" remote add origin https://github.com/simfeo/blender.git
          git -C "$RUNNER_TEMP/full-blender-src" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/full-blender-src" sparse-checkout set build_files/android/apk/app/src/main
          git -C "$RUNNER_TEMP/full-blender-src" -c protocol.version=2 fetch --depth=1 --filter=blob:none origin d93bd33cba768e19ee4387a31c0ea137ee2f0047
          git -C "$RUNNER_TEMP/full-blender-src" checkout --detach -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/full-blender-src" rev-parse HEAD)" = "d93bd33cba768e19ee4387a31c0ea137ee2f0047"

      - name: Stage genuine Blender engine and Render agent into full APK
        run: |
          python render-native/tools/assemble_full_native.py \
            --engine-apk "$RUNNER_TEMP/blender-full.apk" \
            --bridge-apk render-native/app/build/outputs/apk/debug/app-debug.apk \
            --upstream-source "$RUNNER_TEMP/full-blender-src" \
            --output render-native/full-app/stage

      - name: Configure Render ONLY with original VideoStudio signer
        run: |
          python tools/prepare_render_signed_build.py \
            --gradle render-native/full-app/app/build.gradle \
            --keystore "$VIDEOSTUDIO_SIGNING_KEYSTORE"

      - name: Build signed native Render APK inside VideoStudio repository
        run: gradle -p render-native/full-app --no-daemon :app:assembleDebug

      - name: Verify VideoStudio signing identity and actual Blender engine
        shell: bash
        run: |
          set -euo pipefail
          APK=render-native/full-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tqq "$APK"
          unzip -Z -1 "$APK" | grep -Fx 'lib/arm64-v8a/libblender.so'
          unzip -Z -1 "$APK" | grep -Fx 'lib/arm64-v8a/librender_bridge.so'
          unzip -Z -1 "$APK" | grep -Fx 'assets/blender_runtime.zip'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/render-videostudio-badging.txt"
          grep -q "package: name='com.rezox.render'" "$RUNNER_TEMP/render-videostudio-badging.txt"
          python tools/prepare_render_signed_build.py \
            --keystore "$VIDEOSTUDIO_SIGNING_KEYSTORE" \
            --apk "$APK" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          sha256sum "$APK" | tee "$RUNNER_TEMP/render-videostudio-sha256.txt"
          echo "Verified: Render has VideoStudio's original APK certificate only." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Render-Full-Blender-VideoStudio-Signing-Certificate-ONLY
          path: render-native/full-app/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Render-VideoStudio-Signing-Proof
          path: |
            ${{ runner.temp }}/render-videostudio-badging.txt
            ${{ runner.temp }}/render-videostudio-sha256.txt
          retention-days: 14
