name: OMEGA CinemaBench and Native Impact Dynamics

on:
  pull_request:
    branches:
      - main
      - feat/native-voice-waveform-visemes-v454
      - 'feat/project-omega-*'
    paths:
      - 'src/omega/**'
      - 'scripts/omega-*'
      - 'scripts/encode-story-film-proof.py'
      - 'scripts/encode-duel-film-proof.py'
      - 'docs/PROJECT_OMEGA_*'
      - '.github/workflows/omega.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cinemabench:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify M0 CinemaBench, M1 native-film adapter and M2 Motion DNA
        run: node --test scripts/omega-cinemabench-test.mjs scripts/omega-native-proof-test.mjs scripts/omega-motion-dna-test.mjs scripts/omega-skeleton-test.mjs scripts/omega-physics-brain-test.mjs scripts/omega-impact-dynamics-test.mjs
      - name: Syntax checks
        run: |
          node --check src/omega/cinemabench.js
          node --check scripts/omega-cinemabench.mjs
          node --check scripts/omega-native-proof.mjs
          node --check scripts/omega-native-proof-test.mjs
          node --check src/omega/motion-dna.js
          node --check scripts/omega-motion-dna.mjs
          node --check scripts/omega-motion-dna-test.mjs
          node --check src/omega/skeleton-dna.js
          node --check scripts/omega-skeleton.mjs
          node --check scripts/omega-skeleton-test.mjs
          node --check src/omega/physics-brain.js
          node --check scripts/omega-physics-brain.mjs
          node --check scripts/omega-physics-brain-test.mjs
          node --check src/omega/impact-dynamics.js
          node --check scripts/omega-impact-dynamics.mjs
          node --check scripts/omega-impact-dynamics-test.mjs
          python3 -m py_compile scripts/encode-story-film-proof.py scripts/encode-duel-film-proof.py

  native-film-proof:
    # Run one targeted Android Canvas proof for M1/M2/M2.1 review PRs; no APK build.
    # No APK signing, release/deploy, or private device command is performed.
    if: github.event_name == 'pull_request' && (github.base_ref == 'feat/project-omega-cinemabench-m0' || github.base_ref == 'feat/project-omega-native-film-m1' || github.base_ref == 'feat/project-omega-motion-dna-m2' || (github.base_ref == 'feat/project-omega-skeleton-m21' || github.base_ref == 'feat/project-omega-physicsbrain-m3'))
    needs: cinemabench
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VIDEOSTUDIO_STORY_FILM_PROOF: '1'
      VIDEOSTUDIO_DUEL_FILM_PROOF: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure Android SDK 36
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/package.xml" ]; then
            timeout 240s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null'
          fi
          test -f "$ANDROID_HOME/platforms/android-36/package.xml"
      - name: Produce actual CI Android Canvas 240-frame story and 100-frame duel proofs
        working-directory: android
        run: |
          gradle :app:testDebugUnitTest \
            --tests com.rezoxnemesis.videostudio.SketchStoryFilmNativeProofTest \
            --tests com.rezoxnemesis.videostudio.SketchDuelAnimationExampleTest \
            --tests com.rezoxnemesis.videostudio.SketchAnimationContactDirectorTest \
            --tests com.rezoxnemesis.videostudio.SketchAnimationImpactDynamicsTest \
            --stacktrace
      - name: Ensure FFmpeg and FFprobe
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          command -v node && command -v ffmpeg && command -v ffprobe
      - name: Encode genuine native PNGs then check OMEGA evidence before PNG cleanup
        run: |
          set -euo pipefail
          python3 scripts/encode-story-film-proof.py
          python3 scripts/encode-duel-film-proof.py
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          for (const [kind,dir,expected] of [
            ['story','sketch-story-film-proof',240], ['duel','sketch-duel-film-proof',100]
          ]) {
            const file=`android/app/build/${dir}/omega-native-report.json`;
            const proof=JSON.parse(readFileSync(file,'utf8'));
            if (proof.gate!=='READY_FOR_VISUAL_REVIEW' || proof.releaseDecision!=='MANUAL_REVIEW_REQUIRED' ||
                proof.frameAudit.frameEvidence!=='PNG_SHA256_VERIFIED' ||
                proof.frameAudit.stats.verifiedFrameFiles!==expected ||
                proof.movie.decodedFrames!==expected || proof.kind!==kind)
              throw new Error(`OMEGA M1 evidence rejected: ${file}`);
            console.log(`${kind}: ${expected} native hashes and encoded MP4 verified; artistic/phone review still required`);
          }
          NODE
      - name: Confirm M2 decoded motion evidence and manual-review boundary
        if: github.base_ref == 'feat/project-omega-native-film-m1' || github.base_ref == 'feat/project-omega-motion-dna-m2' || (github.base_ref == 'feat/project-omega-skeleton-m21' || github.base_ref == 'feat/project-omega-physicsbrain-m3')
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const [kind,folder,count] of [
            ['story','sketch-story-film-proof',60],['duel','sketch-duel-film-proof',25]
          ]) {
            const report=JSON.parse(readFileSync(`android/app/build/${folder}/omega-motion-dna.json`,'utf8'));
            if (report.status !== 'MEASURED' || report.kind !== kind ||
                report.qualityDecision !== 'MANUAL_REVIEW_REQUIRED' ||
                report.measured.decodedSampleCount !== count ||
                report.measured.evaluatedPairs < 12 ||
                report.ownerPhonePlaybackVerified !== false ||
                report.semanticActingQualityVerified !== false) {
              throw new Error(`Motion DNA native-film diagnostic invalid for ${kind}`);
            }
            console.log(`${kind}: ${report.measured.evaluatedPairs} sampled pair diagnostics; `+
              `${report.measured.localizedMotionCandidatePairs} localized pixel-change candidates; `+
              `human/phone acceptance still required`);
          }
          NODE
      - name: Confirm M2.1 native authored skeleton evidence
        if: github.base_ref == 'feat/project-omega-motion-dna-m2' || (github.base_ref == 'feat/project-omega-skeleton-m21' || github.base_ref == 'feat/project-omega-physicsbrain-m3')
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const root='android/app/build/sketch-duel-film-proof/';
          const report=JSON.parse(readFileSync(root+'omega-skeleton-dna.json','utf8'));
          if (report.status!=='MEASURED' || report.kind!=='duel' ||
              report.qualityDecision!=='MANUAL_REVIEW_REQUIRED' ||
              report.measurements.frameCount!==100 ||
              report.measurements.activeShotCount!==3 ||
              report.measurements.authoredRigCount<6 ||
              report.measurements.hardFootContactSamples<20 ||
              report.measurements.checkedInteractionCues!==1 ||
              report.professionalAnimationVerified!==false ||
              report.physicalPhoneVerified!==false)
            throw new Error('OMEGA M2.1 native rig evidence or honesty gate rejected');
          console.log(JSON.stringify({
            frames:report.measurements.frameCount,
            activeShots:report.measurements.activeShotCount,
            articulatedPairs:report.measurements.rootRelativeArticulationPairs,
            plantedSamples:report.measurements.hardFootContactSamples,
            measuredContactGapPx:report.interactionCues[0].gapPx,
            qualityDecision:report.qualityDecision,
            findings:report.findings
          },null,2));
          NODE
      - name: Confirm M3 real hand contact and planted-foot preservation
        if: (github.base_ref == 'feat/project-omega-skeleton-m21' || github.base_ref == 'feat/project-omega-physicsbrain-m3')
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const root='android/app/build/sketch-duel-film-proof/';
          const physics=JSON.parse(readFileSync(root+'omega-physics-brain.json','utf8'));
          if(physics.status!=='MEASURED' || physics.qualityDecision!=='MANUAL_REVIEW_REQUIRED' ||
             physics.contact.verifiedGapPx>6 || physics.contact.reductionPx<15 ||
             physics.contact.maximumAllowedGapPx!==8 ||
             physics.contact.maxFootContactErrorPx>.02 ||
             physics.ownerPhonePlaybackVerified!==false || physics.usableForAutomaticFilmRelease!==false)
              throw new Error('M3 failed native authored-contact QA');
          console.log(JSON.stringify(physics.contact,null,2));
          NODE
      - name: Verify M3.1 grounded impact acting with native proof
        if: github.base_ref == 'feat/project-omega-physicsbrain-m3'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const root='android/app/build/sketch-duel-film-proof/';
          const report=JSON.parse(readFileSync(root+'omega-impact-dynamics.json','utf8'));
          if(report.status!=='MEASURED' || report.qualityDecision!=='MANUAL_REVIEW_REQUIRED' ||
              report.measured.contactGapPx>6 || report.measured.verifiedMaxWristStepPx>55 ||
              report.measured.reducedMaxWristStepPx<5 ||
              report.measured.actualHardFootSamples!==104 ||
              report.measured.maxFootErrorPx>.02 ||
              report.professionalActingVerified!==false ||
              report.physicalPhoneVerified!==false || report.automaticFilmReleaseApproved!==false)
            throw new Error('M3.1 failed grounded native acting-quality gate');
          console.log(JSON.stringify(report.measured,null,2));
          NODE
      - name: Keep audit reports, reproducible provenance, native samples and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OMEGA-M1-M2-M21-M3-M31-native-film-proof
          retention-days: 7
          if-no-files-found: warn
          path: |
            android/app/build/sketch-story-film-proof/omega-motion-dna.json
            android/app/build/sketch-story-film-proof/omega-native-report.json
            android/app/build/sketch-story-film-proof/omega-frame-manifest.json
            android/app/build/sketch-story-film-proof/mp4-verified.json
            android/app/build/sketch-story-film-proof/*.mp4
            android/app/build/sketch-story-film-proof/contact-sheet.png
            android/app/build/sketch-duel-film-proof/omega-motion-dna.json
            android/app/build/sketch-duel-film-proof/omega-skeleton-dna.json
            android/app/build/sketch-duel-film-proof/omega-physics-brain.json
            android/app/build/sketch-duel-film-proof/omega-impact-dynamics.json
            android/app/build/sketch-duel-film-proof/duel-stage-metrics.json
            android/app/build/sketch-duel-film-proof/native-rig-tracks.json
            android/app/build/sketch-duel-film-proof/native-duel-proof.json
            android/app/build/sketch-duel-film-proof/editable-duel-source.json
            android/app/build/sketch-duel-film-proof/editable-duel-program.json
            android/app/build/sketch-duel-film-proof/omega-native-report.json
            android/app/build/sketch-duel-film-proof/omega-frame-manifest.json
            android/app/build/sketch-duel-film-proof/mp4-verified.json
            android/app/build/sketch-duel-film-proof/*.mp4
            android/app/build/sketch-duel-film-proof/contact-sheet.png
            android/app/build/test-results/testDebugUnitTest/
