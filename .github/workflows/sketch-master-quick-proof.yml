name: Linked Master Focused Proof
on:
  push:
    branches: [feat/video-studio-master-linked-artwork-p1-20261019]
  workflow_dispatch:
    inputs:
      native_study_blob_sha:
        description: "Optional exact Git blob containing source-bound native study evidence; transport only"
        required: false
        default: ""
      native_study_sha256:
        description: "Exact SHA256 of that evidence ZIP"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: linked-master-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-master-tests:
    if: github.event_name != 'workflow_dispatch' || inputs.native_study_blob_sha == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME"
          if [ ! -f "$sdk/platforms/android-36/package.xml" ] || [ ! -x "$sdk/build-tools/35.0.0/aapt" ]; then
            timeout 240s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null'
          fi
          test -f "$sdk/platforms/android-36/package.xml"
      - name: Run only linked master behavior tests
        working-directory: android
        run: |
          gradle :app:compileDebugJavaWithJavac :app:testDebugUnitTest --tests 'com.rezoxnemesis.videostudio.SketchMasterAssetsTest' --stacktrace
      - name: Save precise test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sketch-master-focused-proof
          retention-days: 7
          if-no-files-found: warn
          path: android/app/build/test-results/testDebugUnitTest/

  native-study-delivery:
    if: github.event_name == 'workflow_dispatch' && inputs.native_study_blob_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source and native evidence checksums
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_STUDY_BLOB_SHA: ${{ inputs.native_study_blob_sha }}
          NATIVE_STUDY_SHA256: ${{ inputs.native_study_sha256 }}
        run: python3 scripts/receive-native-study-evidence.py
      - name: Deliver unchanged native study and editable archive
        uses: actions/upload-artifact@v4
        with:
          name: native-pencil-study
          retention-days: 30
          if-no-files-found: error
          path: work/native-study-evidence/
