name: VideoStudio 2 (desktop)

on:
  push:
    branches: [desktop, studio5]
    paths: ["desktop/**", "src/**", "tools/**", ".github/workflows/desktop.yml", "package.json", "package-lock.json"]
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: "2.5.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Engine — install, typecheck, test
        run: |
          npm ci
          npx tsc --noEmit
          npm test

      - name: Desktop — install and typecheck
        working-directory: desktop
        run: |
          npm ci
          npm ci --prefix film || npm install --prefix film   # the film engine of Code Studio (its canvas library)
          npm ci --prefix voice || npm install --prefix voice # VolTune Studio voices (onnxruntime-node)
          node voice/build.mjs                                # bundle the studio voice worker
          npx tsc --noEmit -p tsconfig.json
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Desktop — bundle the full GPU ffmpeg (NVENC/CUDA, x264, x265, ProRes, vid.stab)
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p vendor/ffmpeg /tmp/ff
          # Newest versioned GPL static build (non-shared); fall back to the rolling master build.
          # NVENC API by ffmpeg release: 9.x needs driver 610+, 8.0 needs 570+ (API 13.0), 7.1 needs 550+.
          # Ship 8.x (NVENC API 13.0) so current drivers (e.g. 595) get the GPU encoder; fall back to 7.x.
          assets=$(gh api repos/BtbN/FFmpeg-Builds/releases/tags/latest --jq '.assets[].name')
          name=$(echo "$assets" | grep -E '^ffmpeg-n8\.[0-9]+-latest-linux64-gpl-8\.[0-9]+\.tar\.xz$' | sort -V | tail -1 || true)
          [ -n "$name" ] || name=$(echo "$assets" | grep -E '^ffmpeg-n7\.[0-9]+-latest-linux64-gpl-7\.[0-9]+\.tar\.xz$' | sort -V | tail -1 || true)
          [ -n "$name" ] || { echo "No ffmpeg 8.x/7.x build found"; echo "$assets" | grep linux64-gpl; exit 1; }
          echo "Using $name"
          curl -fsSL -o /tmp/ff/ff.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$name"
          tar -xf /tmp/ff/ff.tar.xz -C /tmp/ff
          cp /tmp/ff/ffmpeg-*/bin/ffmpeg /tmp/ff/ffmpeg-*/bin/ffprobe vendor/ffmpeg/
          chmod +x vendor/ffmpeg/*
          vendor/ffmpeg/ffmpeg -hide_banner -version > /tmp/ff/version.txt; head -1 /tmp/ff/version.txt
          vendor/ffmpeg/ffmpeg -hide_banner -encoders > /tmp/ff/enc.txt
          vendor/ffmpeg/ffmpeg -hide_banner -filters > /tmp/ff/flt.txt
          for e in h264_nvenc hevc_nvenc libx264 libx265 prores_ks; do grep -q " $e " /tmp/ff/enc.txt && echo "encoder $e: yes" || { echo "missing $e"; exit 1; }; done
          for f in vidstabdetect minterpolate nlmeans lut3d zscale loudnorm; do grep -q " $f " /tmp/ff/flt.txt && echo "filter $f: yes" || echo "filter $f: no"; done

      # Bodies, motion capture, the instrument bank and the voice model are built from their public sources
      # (pinned in the script) and kept between runs; the repository itself stays light.
      - name: Stage, Music and Voice assets — restore
        id: assets
        uses: actions/cache@v4
        with:
          path: desktop/stage-assets
          key: stage-assets-${{ hashFiles('tools/**') }}

      - uses: actions/setup-python@v5
        if: steps.assets.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - name: Stage, Music and Voice assets — build
        if: steps.assets.outputs.cache-hit != 'true'
        run: |
          pip install --quiet numpy onnx
          JOBS=4 tools/build_stage_assets.sh desktop/stage-assets "$RUNNER_TEMP/stage-build"

      - name: Stage, Music and Voice assets — check
        run: |
          set -e
          for f in human.pack motion/index.json music/GeneralUser-GS.sf2 voice/dur.onnx voice/pros.onnx voice/voc.onnx voice/voices/hf_alpha.bin voice/voices/ef_dora.bin voice/voices/pm_santa.bin voice/voices/af_nova.bin models/index.json; do
            test -s "desktop/stage-assets/$f" || { echo "missing $f"; exit 1; }
          done
          du -sh desktop/stage-assets

      - name: Code Studio — the film engine draws (its canvas library loads, the people library is there)
        working-directory: desktop/film
        run: |
          set -e
          node devtests/hands.mjs                  # real bodies: hands close towards the palm, fingers side by side, the thumb where a thumb rests
          node devtests/face.mjs                   # real heads: the features are found and drawn (nose, lips, lids), hair shades the brow
          node devtests/costume.mjs                # costume: a robe's skirts hang, part in front and stream behind; tied hair hangs from its cord
          node library2d/build.mjs library2d/out   # the 2D library: 587 assets drawn by code (backgrounds, cut-out rigs, effects, props, faces, hands, pixel, stickman)
          node -e "const i=require('./library2d/out/index.json'); if (i.count < 500) { console.error('library too small', i.count); process.exit(1) } console.log('2D library', i.count, JSON.stringify(i.cats))"
          node runner/worker.mjs people '{}' | head -c 300
          node runner/worker.mjs personThumb '{"id":"queen_02","size":240}'
          node runner/worker.mjs open "{\"dir\":\"$PWD/templates/starter\"}" | head -c 400
          rm -rf templates/starter/.vs templates/starter/vs.js

      - name: Desktop — build .deb and AppImage
        working-directory: desktop
        run: npm run dist

      - name: Smoke test — the packaged app starts and renders its window
        working-directory: desktop
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          app=$(ls release/*.AppImage | head -1)
          chmod +x "$app"
          "$app" --appimage-extract > /dev/null
          (VSD_NO_SANDBOX=1 xvfb-run -a -s "-screen 0 1600x960x24" ./squashfs-root/videostudio --no-sandbox --remote-debugging-port=9333 > smoke.log 2>&1 &)
          for i in $(seq 1 40); do
            if curl -s http://127.0.0.1:9333/json/list | grep -q '"title": "VideoStudio"'; then echo "Window is up"; break; fi
            sleep 1
          done
          curl -s http://127.0.0.1:9333/json/list | grep -q '"title": "VideoStudio"' || { cat smoke.log; exit 1; }
          test -x squashfs-root/resources/ffmpeg/ffmpeg && echo "GPU ffmpeg is inside the package"
          test -s squashfs-root/resources/film/runner/worker.mjs && test -d squashfs-root/resources/film/node_modules/@napi-rs/canvas && test -s squashfs-root/resources/forge/run.py && test -s squashfs-root/resources/stage-assets/models/index.json && test -s squashfs-root/resources/film/library2d/out/index.json && echo "Code Studio, the forge, the model library and the 2D library are inside the package"
          test -s squashfs-root/resources/voice/worker.mjs && test -s squashfs-root/resources/voice/node_modules/onnxruntime-node/bin/napi-v6/linux/x64/onnxruntime_binding.node && test -s squashfs-root/resources/voice/node_modules/onnxruntime-node/bin/napi-v6/linux/x64/libonnxruntime.so.1 && echo "Studio voices (onnxruntime-node) are inside the package"
          test -s squashfs-root/resources/stage-assets/human.pack && test -s squashfs-root/resources/stage-assets/voice/voc.onnx && test -s squashfs-root/resources/stage-assets/music/GeneralUser-GS.sf2 && echo "Stage, Music and Voice assets are inside the package"
          pkill -f squashfs-root/videostudio || true

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="desktop-v${VERSION}"
          notes="VideoStudio ${VERSION} for Linux (Kubuntu/Ubuntu/OREZ). Installs over VideoStudio 2.0 (and replaces VideoStudio Desktop 1.0.x); projects and the Claude link are kept.

          New: a sword is held the way a hand holds it. On the Stage a sword hand now lies along its forearm with the back of the hand and the knuckles outwards (it used to turn the palm out and break the wrist): the forearm rolls, the wrist tips, and the hilt lies a little askew in the grip, each within what an arm can do. The elbow goes where an elbow goes (out to the side under a raised hand, below a thrust, behind a hanging arm) and never flips; an arm near the end of its reach eases out instead of snapping straight; between two sword positions the hand travels round the shoulder in an arc and the point of the blade comes through the front; the chest turns with the sword without a jerk. The high, high-right and overhead positions now sit where an arm can hold them. In code films a closed hand seen from the back shows its knuckles, the thumb is outlined where it lies over the hand instead of along a jagged seam where it joins it, and a hand is drawn with a finer line than the body, so fingers a few pixels wide no longer close up into blots of ink.

          New: costume for real bodies in code films. A robe with long skirts that hang from the waist over the trousers, open in front with the lining showing and a trim along the hem, swinging and streaming behind a moving figure; sleeves of their own colour (a dark vest over a white robe); hair tied in a tail now hangs from its tie from the first frame of a shot and is bound with a cord of its own colour. Fingers that lie side by side are drawn as fingers, with a line between neighbours, and the thumb is outlined against the hand.

          New: real hands and faces for code films. Hands: fingers now close towards the palm on both hands (the right hand used to bend backwards), lie side by side instead of fanning out, the thumb rests beside the index finger, a fist is a fist with the thumb laid over the fingers, and a sword, spear or staff is held with the fingers wrapped round it; a hand the film does not pose is held naturally by itself. Faces: every real head now has a drawn nose (its shadow side follows the light, a shadow under the tip, nostrils, and the line of the nose when the head turns), lips with the line where they meet, the shadow under the lower lip, the crease of the eyelids, and the hair throws its shadow on the brow; a closed mouth no longer shows teeth. The 3D page closes the right hand the right way too. Films drawn before are drawn again with the new hands and faces the next time they are built.

          New: Studio voices — natural, acted delivery for every English and Hindi VolTune voice (real rhythm, breaths and pauses, much clearer Hindi), with emotions from plain directions such as (emotional hoke) or ‘is dialogue ko emotional hoke bolna hai’. Help → Studio voices… installs it once (about 1.5 GB, Chatterbox Multilingual, MIT licence, runs on this PC); then voice lines, Stage dialogue and code films use it. Also: 10 learned Hindi voices with 11 acted emotions, Hindi words हूँ, में, नहीं, क्यों pronounced fully again, and a better Hinglish reader.

          New in 2.5, the grand mega upgrade. Sensei — VideoStudio's own judge and helper: a measured review of every frame of a code film (motion, anatomy, camera, framing, picture, sound, story, and the drawing style against your own reference art), scores and a grade per category, marked frames with the exact fix, a gate that stops an export while a MUST is open; it talks (built in, a local model through Ollama, or your own key), searches the web, runs jobs side by side. A painted anime look (soft cel light, warm skin at the turn of the light, polished metal, hair sheen, rim light, painted skies). A 2D library of 587 pictures drawn by the app: backgrounds in five painted layers for the multiplane camera, cut-out characters with rigs that walk, pose, blink and speak, effects, props, faces, hands, balloons and titles, textures, pixel sprites, stick figures — in films, in the Code page and in Animate (characters come in as posable puppets). Animate → Fix a film shot: draw the better hand once and it follows that hand on every frame; erase what is wrong and the film draws what is behind it; every fix switches on and off. Code Studio: completion that knows the whole film kit and every id, checks while you type, Sensei's findings on the shot that has them, history of every file with a diff, a console, find in all files, ready pieces to insert. The director: write a scene as a cast and its beats (lines, waits, walks, gestures, looks, feelings) and it stages, times, covers and cuts it — an establishing shot, over-the-shoulder shots, close-ups and reactions — with 2D painted far layers around 3D sets. Every character line speaks with the open voice (tones, no download to wait on).

          New in 2.4, the mega update. Real bodies: characters drawn from a full anatomical body (163 bones) with five-finger hands that grip, real heads with acting faces and anime eyes, hair that swings, cloth layers and cast shadows; action with speed ramps, hit-stops, blade arcs, clashes and blood. Code Studio films in 11 looks: 2D anime, 2.5D multiplane, 3D render, 3.5D cel-shaded, 4D immersive, paper cut, puppet, flat motion graphics, pixel art, pencil sketch, manga; 854 library 3D models. Voices: 15 more voices, 18 new character voices, speech in German, Russian, Spanish, French, Italian, Portuguese, Dutch, Polish and more, read sentence by sentence like a person. Music: 33 new instruments made by the app (808, supersaws, FM keys, choirs, braams, risers, sitar, tanpura, bansuri, harmonium, santoor, shehnai, sarangi), trap, dance, lo-fi, film and tabla kits, 11 new styles, clearer singing and Vocals / Music / Clarity faders with stems.

          • VideoStudio-${VERSION}-amd64.deb — double-click to install (Discover / package installer). It removes the old VideoStudio Desktop package by itself and keeps your projects and the Claude link.
          • VideoStudio-${VERSION}-x86_64.AppImage — portable: allow executing, then open.

          New in 2.3: Code Studio — a Code page where a film is written as code: a real code editor, the frame under the cursor drawn at once, every shot kept as its own video so a change redraws only the shots it touches and the film is joined again in seconds (shots can be left out without deleting anything); a 2D library of 380 people, 22 places at four times of day, 126 props and 43 sounds; a 3D model library of 854 ready models (KayKit by Kay Lousberg, CC0) to stand beside the characters of the 3D Stage; and the Blender forge — your own Blender makes trees, rocks, land, buildings, 3D lettering or anything written for it, and converts fbx / obj / blend files, straight onto the Stage.
          New in 2.2: a 3D page (real human characters, 2,500+ motion-capture performances, walking with planted feet, sword and unarmed fight choreography, cameras that frame like an operator, cinematic and anime looks, a director's view and an action timeline); anime action for 2D (hit-stop, shake, zoom punch, flashes, afterimages, auras, on twos, speed lines, lightning, beams, one-tap moves); a Music page (261 instruments, 13 drum kits, a composer with 25 styles, ragas and taals, piano roll, MIDI in and out); VolTune voices that read Hindi, Hinglish and Indian English, speak in 15 tones and sing your lyrics.
          From 2.1: a colour page (grading nodes, wheels, custom and hue curves, HSL qualifier, animated power windows, .cube LUTs with camera transforms and film looks, LUT export, compare wipe), Shot Match and Auto balance, Audience Lens (predicted score, attention curve, one-click fixes, Evolve), Style DNA (measure and transplant the feel of any video), faster split-screen and 4K renders.
          From 2.0: native media core, professional player, video scopes, live view of every step Claude takes.

          Built from ${GITHUB_SHA::7}."
          gh release create "$tag" desktop/release/*.deb desktop/release/*.AppImage --title "VideoStudio ${VERSION}" --notes "$notes" --target "$GITHUB_SHA" --latest=false
