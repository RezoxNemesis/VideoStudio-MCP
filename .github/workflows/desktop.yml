name: VideoStudio 2 (desktop)

on:
  push:
    branches: [desktop, studio5]
    paths: ["desktop/**", "src/**", "tools/**", ".github/workflows/desktop.yml", "package.json", "package-lock.json"]
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: "2.6.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Engine — install, typecheck, test
        run: |
          # (each stage says in an annotation why it failed, so the cause can be read without opening the log)
          say() { echo "::error title=$1::$(tail -c 1500 /tmp/stage.log | tr '\n' ' ' | sed 's/%/%25/g')"; exit 1; }
          npm ci > /tmp/stage.log 2>&1 || say "npm ci"
          npx tsc --noEmit > /tmp/stage.log 2>&1 || say "typecheck"
          npm test > /tmp/stage.log 2>&1 || say "tests"

      - name: Desktop — install and typecheck
        working-directory: desktop
        run: |
          npm ci
          npm ci --prefix film || npm install --prefix film   # the film engine of Code Studio (its canvas library)
          npm ci --prefix voice || npm install --prefix voice # VolTune Studio voices (onnxruntime-node)
          node voice/build.mjs                                # bundle the studio voice worker
          npx tsc --noEmit -p tsconfig.json
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Desktop — bundle the full GPU ffmpeg (NVENC/CUDA, x264, x265, ProRes, vid.stab)
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p vendor/ffmpeg /tmp/ff
          # Newest versioned GPL static build (non-shared); fall back to the rolling master build.
          # NVENC API by ffmpeg release: 9.x needs driver 610+, 8.0 needs 570+ (API 13.0), 7.1 needs 550+.
          # Ship 8.x (NVENC API 13.0) so current drivers (e.g. 595) get the GPU encoder; fall back to 7.x.
          assets=$(gh api repos/BtbN/FFmpeg-Builds/releases/tags/latest --jq '.assets[].name')
          name=$(echo "$assets" | grep -E '^ffmpeg-n8\.[0-9]+-latest-linux64-gpl-8\.[0-9]+\.tar\.xz$' | sort -V | tail -1 || true)
          [ -n "$name" ] || name=$(echo "$assets" | grep -E '^ffmpeg-n7\.[0-9]+-latest-linux64-gpl-7\.[0-9]+\.tar\.xz$' | sort -V | tail -1 || true)
          [ -n "$name" ] || { echo "No ffmpeg 8.x/7.x build found"; echo "$assets" | grep linux64-gpl; exit 1; }
          echo "Using $name"
          curl -fsSL -o /tmp/ff/ff.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$name"
          tar -xf /tmp/ff/ff.tar.xz -C /tmp/ff
          cp /tmp/ff/ffmpeg-*/bin/ffmpeg /tmp/ff/ffmpeg-*/bin/ffprobe vendor/ffmpeg/
          chmod +x vendor/ffmpeg/*
          vendor/ffmpeg/ffmpeg -hide_banner -version > /tmp/ff/version.txt; head -1 /tmp/ff/version.txt
          vendor/ffmpeg/ffmpeg -hide_banner -encoders > /tmp/ff/enc.txt
          vendor/ffmpeg/ffmpeg -hide_banner -filters > /tmp/ff/flt.txt
          for e in h264_nvenc hevc_nvenc libx264 libx265 prores_ks; do grep -q " $e " /tmp/ff/enc.txt && echo "encoder $e: yes" || { echo "missing $e"; exit 1; }; done
          for f in vidstabdetect minterpolate nlmeans lut3d zscale loudnorm; do grep -q " $f " /tmp/ff/flt.txt && echo "filter $f: yes" || echo "filter $f: no"; done

      # Bodies, motion capture, the instrument bank and the voice model are built from their public sources
      # (pinned in the script) and kept between runs; the repository itself stays light.
      - name: Stage, Music and Voice assets — restore
        id: assets
        uses: actions/cache@v4
        with:
          path: desktop/stage-assets
          key: stage-assets-${{ hashFiles('tools/**') }}

      - uses: actions/setup-python@v5
        if: steps.assets.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - name: Stage, Music and Voice assets — build
        if: steps.assets.outputs.cache-hit != 'true'
        run: |
          pip install --quiet numpy onnx
          JOBS=4 tools/build_stage_assets.sh desktop/stage-assets "$RUNNER_TEMP/stage-build"

      - name: Stage, Music and Voice assets — check
        run: |
          set -e
          for f in human.pack motion/index.json music/GeneralUser-GS.sf2 voice/dur.onnx voice/pros.onnx voice/voc.onnx voice/voices/hf_alpha.bin voice/voices/ef_dora.bin voice/voices/pm_santa.bin voice/voices/af_nova.bin models/index.json; do
            test -s "desktop/stage-assets/$f" || { echo "missing $f"; exit 1; }
          done
          du -sh desktop/stage-assets

      - name: Stage — every gait loops on a whole stride, and every captured run obeys gravity (checked on the real motion library)
        run: VS_STAGE_ASSETS_DIR=desktop/stage-assets npx vitest run tests/stagegait.test.ts tests/stagetime.test.ts

      - name: Code Studio — the film engine draws (its canvas library loads, the people library is there)
        working-directory: desktop/film
        run: |
          set -e
          node devtests/hands.mjs                  # real bodies: hands close towards the palm, fingers side by side, the thumb where a thumb rests
          node devtests/face.mjs                   # real heads: the features are found and drawn (nose, lips, lids), hair shades the brow
          node devtests/costume.mjs                # costume: a robe's skirts hang, part in front and stream behind; tied hair hangs from its cord
          node devtests/hairstyle.mjs              # hair designed lock by lock over the real head, swept back to its tie, a sheaf tail, strands painted along every lock
          node devtests/brush.mjs                  # the soft brush: light turns to shadow gradually, cast shadows have soft edges, a fine nose is laid in lightly
          node devtests/paintland.mjs              # painted land and sky: light from where the sun stands, ground that holds to the world, ridges that pale into the air
          node devtests/legion.mjs                 # an army of drawn figures: every man at his place and size, near men cover far ones, thousands from a few drawings
          node devtests/bend.mjs                   # a film's own bends of a performed body: what hangs on a bone goes with it, nothing else moves
          node devtests/worn.mjs                   # the judge sees the body as it is dressed: an arm, a blade or a scabbard inside the real body's outline
          node devtests/takes.mjs                  # another take of a spoken line: asked for per language in script.json
          node devtests/horse.mjs                  # the horse is a rounded body with a horse's measures; tack
          node devtests/rider.mjs                  # a performed body is carried to the saddle and seated
          node devtests/life.mjs                   # nobody is a statue: bodies breathe and sway, a speaker's head rides the words
          node devtests/craft.mjs                  # a dance on the beat, eyes that dart and blink, things in hands, balls with a phase, Kepler's rings, the judge finds a body that holds still
          node devtests/moves.mjs                  # the code collection: every move has rules, code, a check, clips that exist
          node library2d/build.mjs library2d/out   # the 2D library: 587 assets drawn by code (backgrounds, cut-out rigs, effects, props, faces, hands, pixel, stickman)
          node -e "const i=require('./library2d/out/index.json'); if (i.count < 500) { console.error('library too small', i.count); process.exit(1) } console.log('2D library', i.count, JSON.stringify(i.cats))"
          node runner/worker.mjs people '{}' | head -c 300
          node runner/worker.mjs personThumb '{"id":"queen_02","size":240}'
          node runner/worker.mjs open "{\"dir\":\"$PWD/templates/starter\"}" | head -c 400
          rm -rf templates/starter/.vs templates/starter/vs.js

      - name: Desktop — build .deb and AppImage
        working-directory: desktop
        run: npm run dist

      - name: Code Studio — the film engine as one release file, fetched by kit.update (no install, no password)
        working-directory: desktop
        run: |
          set -e
          node build/pack-kit.cjs release
          test -s release/film-kit.json.gz && test -s release/film-kit.json.gz.sha256
          (cd release && sha256sum -c film-kit.json.gz.sha256)

      - name: Smoke test — the packaged app starts and renders its window
        working-directory: desktop
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          app=$(ls release/*.AppImage | head -1)
          chmod +x "$app"
          "$app" --appimage-extract > /dev/null
          (VSD_NO_SANDBOX=1 xvfb-run -a -s "-screen 0 1600x960x24" ./squashfs-root/videostudio --no-sandbox --remote-debugging-port=9333 > smoke.log 2>&1 &)
          for i in $(seq 1 40); do
            if curl -s http://127.0.0.1:9333/json/list | grep -q '"title": "VideoStudio"'; then echo "Window is up"; break; fi
            sleep 1
          done
          curl -s http://127.0.0.1:9333/json/list | grep -q '"title": "VideoStudio"' || { cat smoke.log; exit 1; }
          test -x squashfs-root/resources/ffmpeg/ffmpeg && echo "GPU ffmpeg is inside the package"
          test -s squashfs-root/resources/film/runner/worker.mjs && test -d squashfs-root/resources/film/node_modules/@napi-rs/canvas && test -s squashfs-root/resources/forge/run.py && test -s squashfs-root/resources/stage-assets/models/index.json && test -s squashfs-root/resources/film/library2d/out/index.json && echo "Code Studio, the forge, the model library and the 2D library are inside the package"
          test -s squashfs-root/resources/voice/worker.mjs && test -s squashfs-root/resources/voice/node_modules/onnxruntime-node/bin/napi-v6/linux/x64/onnxruntime_binding.node && test -s squashfs-root/resources/voice/node_modules/onnxruntime-node/bin/napi-v6/linux/x64/libonnxruntime.so.1 && echo "Studio voices (onnxruntime-node) are inside the package"
          test -s squashfs-root/resources/stage-assets/human.pack && test -s squashfs-root/resources/stage-assets/voice/voc.onnx && test -s squashfs-root/resources/stage-assets/music/GeneralUser-GS.sf2 && echo "Stage, Music and Voice assets are inside the package"
          pkill -f squashfs-root/videostudio || true

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="desktop-v${VERSION}"
          notes="VideoStudio ${VERSION} for Linux (Kubuntu/Ubuntu/OREZ). Installs over VideoStudio 2.0 (and replaces VideoStudio Desktop 1.0.x); projects and the Claude link are kept.

          New: Cine 3D, an engine for 2.5D films with real depth, drawn on the graphics card. Painted trees, hills, clouds and cities stand as layers at their true distances; people are toon bodies driven by captured human motion with feet that stay planted; and there is one real lens: rack focus, cranes, orbits, a straight-down view that rolls into a chase, a long lens into a low sun, a dolly-zoom. Light moods (gold, kite sky, monsoon, amber, fog, pink, blue hour, night, neon), rain with splashes, mist, kites, birds, fireworks, bloom and grade. A film is a folder with a film.js; frames are drawn in a hidden window and kept in five-second pieces, so only what changed is drawn again. Claude works it through cine.help (the whole guide, with every number used for the film The Long Road to VI), cine.frame, cine.sheet, cine.render and cine.progress. The engine's tools for bodies, performances, painted textures and synthesised sound come with it (film/cine/tools).

          New: hair drawn the animator's way, and figures measured in heads. Eight hairstyles (messy, neat, spiky, wavy, middle part, side part, long tied, long loose) are built from a few big clumps that grow from the crown in four layers, and painted clean: one flat colour, one soft shade, one band of shine, and ink only round the outline and at the tips. A figure is measured in heads against an animator's proportions guide (7.5 to 8 heads, shoulders, chest, waist, hips, crotch at half the height, knees, hands at mid-thigh). Painted figures get placed shadows under the chin, the hem and the arms whatever the light does, and clothes are lit by their big form: no more stepped patches on the back of a shirt. Fixed: updates. GitHub lists releases by their name as text, so 2.5.100 stood behind 2.5.99 and was never offered; the app now reads the whole list and counts versions as numbers, and versions go on as 2.6.

          Fixed: feet where two captured actions are joined. Where one action ends on standing feet and the next begins on standing feet, a foot that has to move now takes a step (lifted, carried, set down) instead of being dragged across the ground while the bodies blend, as it already did into a fighting stance. And a foot that was still in the air when the first action ended is treated as landing through the blend, but only when it really is off the ground (three centimetres above the standing foot): a foot on the ground that moves is still reported as a slide. In the practice run this removed the last serious foot slide, where the boy turns from picking up the bag into his start. The same now holds when a fight is the first thing a body does: two swordsmen who stood and then took their stances slid all four feet 30 centimetres apart, because the step-in only ran after another action; now they step.

          Fixed: some captured performers moved at double speed. The motion library's source says every performance was recorded at 120 frames a second, but some performers were recorded at 60, so everything they did played twice as fast as they did it. It was found by physics: a runner's hips fell at four times gravity, and the clip used as a sprint took 340 steps a minute, which no legs can do. The clips of performers 75, 77, 88, 106, 139, 141 and 143 now play at their true speed (a pick-up takes two seconds, not one), and a rule on the real library keeps it so: no captured run may fall faster than gravity allows or step faster than legs can. Moments written for those clips are true seconds now, so double any in, out or pose moment written for them before. The motion library itself is now packed with those performers at their true rate, so their clips also have twice the detail they had. New: a walk or a run by numbers. VideoStudio 2 reads from any solved performance the steps a minute against what is usual for those legs, the step length, the time in the air, the lean, the knee lift, whether the arms swing against the legs and how far apart the hands go, and says what a coach would say is wrong (gait.mjs, gaitReport). The fastest honest runs in the library are about 4.3 to 5 metres a second at 176 to 198 steps a minute, which is what a real runner does.

          New: a dance can be locked to its music. A captured dancer is not a metronome, so VideoStudio 2 now measures the dancer's own pulse (the bounce of the hips, not only the steps), takes the music's tempo from it, and then moves every bounce onto the beat by playing each stretch a little faster or slower, never more than 15 percent (beatLock). In the practice dance 24 of 25 bounces now fall on a half beat, and the big drop lands on the first beat of a bar. The method, with the measured moments of a captured Dive, Twist and Cabbage Patch, is in the code collection as dance-on-beat, next to a new hand-clear recipe for a hand that brushes the body. Sensei no longer mistakes a dancer's quick real arm gesture for the arm fault: a fault snaps faster than any arm can move.

          New: the code collection. Every movement that has been worked out is now kept ready to use inside VideoStudio 2, each as one page: what it is for, the rules that make it read, the captured clips with their exact moments, the functions and tools it needs, the code to paste, and how to check it. Claude asks for a move by name or in plain words (code.moves with q: pick up a bag) before working one out again. It starts with fifteen: run, sprint, brake, pick-up, carry, sit-alive, fall, kneel, look, caught-looking, wait, duel-ending, dance-on-beat, solar-system, wave. And Sensei now finds by itself arms that fly out for a moment (the fault a runner showed once every stride).

          Fixed: someone struck down now falls. The loser of a fight used to be on the ground a sixth of a second after the blow, because the knockout played a captured get-up backwards, five seconds of it squeezed into one. It is now a captured fall played forwards at its own speed: the body is rocked, loses its footing, goes over and lands, in a bit more than half a second, and it no longer sinks into the floor when it lies. Fights in existing films are solved again by themselves at the next build.

          Fixed: a runner no longer throws his arms out sideways once every stride. A run or walk cycle that began within a quarter of a second of its captured clip's start was blended, at every loop, with the clip's very first frame, which in a motion capture is the T-pose with the arms straight out. The loop now only ever leans on moments that exist inside the clip (what came before the cycle, or what comes after it), so the arms stay in their swing through every seam. Films that have runs are solved again by themselves at the next build.

          New: numbers on every bar. Whatever is being made, the window now says how far it is: the whole job in percent, the step that runs (Step 3 of 6), its counts (1,034 of 2,460 frames), its speed and the time left. A film build is weighed by what each stage really costs on this computer (speaking, solving, making music, drawing, mixing, joining) and learns from every build, so the percentage and the time left get truer each time. Solving a performance, which used to freeze the window for minutes, now reports frame by frame and can be stopped: Stop works at every stage. The status bar shows a small meter for anything in work (film, export, voice, Sensei), and Claude reads the same numbers while a job runs. New craft for films, each proved in a practice reel and written into the handbook: a dance laid on the beat of its music (the dancer's steps are found and the captured clip is retimed so they fall on the beats; devtests/steps.mjs does the sums), eyes that move like eyes (they dart to a new target in two or three frames, a big change of gaze takes a blink with it, and eyesLead writes a look whose eyes go first and whose head follows), things that are picked up and carried (carried), and balls lit from one side with the right phase plus a whole solar system that goes round by Kepler's law (ball, solarSystem).

          New: nobody in a film is a statue. Every body now breathes by itself (the chest fills, the shoulders ride up on it), sways a little over its hips and is never quite still, each at its own pace; someone out of breath heaves (alive: 2.5), and a speaker's head rides the words. It reaches the real body, which the old layer never did: a commander's chest used to move a quarter of a centimetre in a whole shot. A horse that stands breathes, carries its head about, turns its ears each by itself, swishes its tail and rests one hind leg and then the other. An army is alive: a legion's figure can wait (performer wait: [t0, t1]) and the legion plays the wait by itself, every man at his own moment and pace, near men on finer moments than far men; which way the men face is now measured from the performance, so an army can no longer stand sideways to its enemy because one number was left out. New tools for films: plantSpear stands a spear on its butt through the hand that holds it, swingArms gives a runner arms that swing against his legs (captured joggers carry both hands before the chest), performer fit is the film's own last word on each drawing. Sensei has a new finding, statue: a body the viewer looks at that holds perfectly still for two seconds. And the director's handbook that code.help returns says how life is made: captured waits with planted feet, a runner who is seen to stop and kneel (the chain of captures that works), cameras that move with a reason, the line between two people, crowds from above.

          New: the judge sees the body as it is dressed, and every build reports what it found. Sensei used to hold arms and blades against rounds drawn from the joints, which cannot tell that a hand has sunk into a bagged tunic or that a scabbard hangs through a coat. It now reads the real body's own outline (the trunk as a shape with an inside) and finds an arm, elbow or hand inside the body (arm-in-body), a held blade inside it (blade-in-body) and a scabbard or hilt worn through the clothes (worn-in-body), each with the shot, the second, the depth and what to do. code.build now comes back with sensei: the grade, how many MUST and SHOULD findings, and the worst few in words with their fixes, so nobody has to remember to ask (sensei: false leaves it out). Two looking tools: code.frame takes scale up to 3 and crop: [left, top, width, height] to enlarge a hand, a face or a hip; code.where gives where bodies and the camera are at a moment of a shot, in numbers. And the reference that code.help returns ends in a director's handbook: the order of work and what goes wrong with bodies, movement, swords, cameras, voices and pictures, with the way each mistake is caught.

          New: a sword at the hip, and drawing it. A sword worn at the hip used to hang through the body: its scabbard crossed behind the back inside the coat and its hilt sat in the belly, so a hand that went to it sank into the clothes. It now hangs where a sword is worn, found on each body as it is dressed: the scabbard through the sash at the left hip, back, down and a little out, lying on the clothes; the hilt before the belly with room for a hand; the guard on the scabbard mouth; the scabbard made to the blade. Drawing it is one sword overlay from sheath: the right hand comes across to the hilt while the chest turns to bring that shoulder round, the left hand takes the scabbard, turns it flat and draws it back, the blade slides out along the scabbard line as far as the arm takes it, passes to the hand without a jump and leaves round the front in a cut, never through the body; ending a sequence in sheath puts it away the same way. The sword stays in its scabbard until it has slid out (it used to jump into the hand when the overlay began). A new overlay, scabbard: true, rests the left hand on the scabbard as a swordsman walks. Also: a forearm sent across the body no longer passes through the belly (the elbow swings round just as far as it takes); the chest turns with the sword hand again in every sword fight (that turn had been switched off by mistake); and a coat or skirt now lies over the trousers and tunic under it everywhere (the seat of wide trousers came through the back of a long coat): it is let out over them, and the trousers are cut away where it covers them. In a code film, a robe on a real body hangs outside the body it is worn on: its waist lies on the body's own outline and no thread enters the hips and seat (the seat showed through the back of a long robe). API.md, Performances.

          New: hands in captured motion, faces with beards, armour with shoulder plates. Every walk, run and march taken from motion capture carried both hands bent out at the wrist by a quarter turn on a real body (a capture's hand has no direction of its own, and it was given one pointing up): walkers held their hands out like trays. A hand now lies along its forearm and swings with the arm. A real head can wear a beard that is painted on its skin and moves with the jaw (face.beard: full, goatee, chin or moustache, how high it grows on the cheek, stubble, strands drawn the way it grows, a heavy moustache over the upper lip), scars (face.scars) and the lines of age (face.lines, face.frown); the face's measure now runs evenly round the side of the head, and the ear is found on every head, so a sideburn stands just before it. Shoulder plates (armor.pauldron) are a cap and lames over each shoulder that go with the arm, and a skirt under a cuirass can be a skirt of plates. A sword at the hip is drawn from the scabbard (sword positions sheath and unsheath: the hand on the hilt, the blade out along the scabbard's own line). Far mountain ranges can have peaks instead of level tops (peaky). A standing horse faces the way its path says, whatever frame is drawn first. The ground a film's performance is solved on is flat everywhere: on the Stage's open plain the land rises beyond 26 metres, and a figure who walked out there stood up to two metres above the film's ground. An army can be made from a soldier of its own sequence before that sequence has ever been solved. And a build that is stopped while the lines are being spoken loses nothing: lines already spoken are only fitted to each other next time, never spoken again. devtests/where.mjs prints where bodies are at a moment of a shot, for setting cameras by numbers.

          New: riders. A horse in a code film is a rounded, painted body now (it was a flat cut-out): trunk, neck, head, legs with their joints and hooves, mane and tail, with a horse's measures (as long as it is tall, the chest as deep as the legs below it are long, the knee a third of the way up, a hind leg of three bones whose cannon stands upright under the hock). It walks, trots and gallops with planted hooves as before, and no bone stretches. It can be saddled (tack: true): saddle, cloth, girth, bridle, reins that run to the rider's hands and stirrups at his feet. A performed person now sits on it with a real body: rider() carries him to the saddle and bends him into a seat (thighs along the barrel, lower legs down the sides, hands at the reins), and rider and horse are painted in one picture, so the horse hides the leg on its far side. API.md, Riders.

          New: a studio voice no longer spoils the first word of a line. For the first third of a second after its reference clip the model hurried and swallowed or changed the first sound: Make a world came out Take a world in eight takes of eight, He is not a man lost its He, Hindi lines began with a sound that is not in them. Every sentence is now spoken after a short sentence of its own (Listen to me. in English, मेरी बात सुनो। in Hindi) which takes that damage, and that sentence is cut away in the pause after it; where the pause lies is read from the moment the attention of the model leaves that sentence for the first word of the line. A take in which the short sentence runs into the line, in which it was skipped, or in which something else is said between the two, is made again; murmur before the line is cut away with it, and a take is stopped once the line has been said instead of saying everything a second time. A slow line is no longer asked for with a weaker hold on its words: the pace of the model did not follow it, and with less of it the model murmured for seconds, skipped words and ran sentences together (Hindi most of all). A reference clip of a voice now ends in half a second of silence and a long clip is cut in a pause instead of through a word (the first sound a voice makes grows out of the last sound of its clip); voices made before are made again on first use.

          New: land and sky painted like a background, and armies of real soldiers. In code films a place can be painted pixel by pixel (skyPaint, ridgePaint, landPaint, mistBand, grassPaint): a sky lit from where the sun stands with drifting clouds that have a lit and a shaded side, ridges round the horizon crest behind crest and lost in mist at their feet, land whose colour varies like grown ground with low light lying on it, mist along the horizon, tufts of grass near the lens. A legion is an army of real figures: a few performed soldiers become figures laid down by the thousand, each drawn at the size and from the side the lens sees him, in step when they march; ten thousand men are drawn in seconds. bendPose turns a bone of a performed body after the performance (a spear carried upright, a rider's seat), and design.body.plates paints armour as rows of small laced plates. API.md has the words.

          New: studio voices in Hindi say the line and nothing else, and a child sounds like a child. A Hindi sentence used to be given a second full stop after its own, and the model babbled on after it; that is gone. The path of the voice through the words of a line is now followed: babble before the line and after it is cut, making a line stops soon after it was said (Hindi lines used to run on to the limit), and a take that leapt over words is made again. A character voice now keeps its own pitch with the studio engine: a little boy or a low villain used to be acted from the plain blend of voices (a boy spoke with a grown man's voice).

          New: a studio voice keeps the pace of its line. VolTune Studio used to speak every line at its own speed, about five words a second, whatever the tone asked: short sentences ran together and the end of a long line was swallowed. A line is now spoken a sentence at a time, the silence the model leaves round a sentence is taken off and the pause its mark and the tone ask for is put in its place, a stray breath after the last word is cut, and the speech is held to about three words a second times the tone's rate without changing its pitch (a line at rate 0.86 comes out near 2.6). In a code film a line that lost or changed a word can be asked for again in one language: take_hi 1 in script.json acts it afresh and leaves the other languages alone (API.md). Listening to a clip (audio.listen) no longer waits four minutes for a graphics card on a computer that has none.

          New: characters painted with a brush, and hair designed lock by lock. In code films the painted look can turn from light to shadow softly (look: style anime, paint.soft 0.85): skin and cloth become rounded, painted forms, the shadows forms throw on each other and hair throws on a face get soft edges, and a fine nose is laid in lightly (face.nose). Hair can be designed the way a character designer draws it: locks laid over the real head from one place to another (a curtain of fringe from the parting to the temple, a long lock in front of the ear), hair swept back to its tie with a clean hairline, a tail that is a sheaf of locks with tips of their own, a cord with two hanging ends, and strands and a zigzag sheen painted along every lock (hair.strands, hair.sheen). A top can be cut like a robe: lapels that cross at the chest over an under-robe with a band along them, and sleeves set in at one clean seam (body.collar, body.sleeves). API.md has the words. A tail of hair now hangs as hair hangs: it leaves its tie in a curve, lies round the back of the head and down the back without passing through either, sways at a walk instead of standing out behind, and comes to rest the same at any frame rate (it used to be drawn towards a straight line behind the head). On the Stage, stage.actor takes garments (a cut of its own: a tunic's flare and bag, trousers' width, a skirt's length) and refuses a negative face detail, naming the detail that goes the other way (a negative weight pushed the lining of the mouth out through the jaw).

          New: VideoStudio can work on a machine without a screen. Started with VSD_LINK_WORKER (and optionally VSD_LINK_KEY) in its environment, the Claude link polls that relay instead of the stored one and stores nothing of it, so a render box or a workspace can run the whole app (motion solves, voices, sound, film builds) through a relay of its own while this PC is off.

          New: running is running. A run used to loop on a stretch that was no whole stride (and on a capture that veers and stops), so a runner passed through standing upright with both feet together twice a second. Every gait now loops on one whole stride of a plain, straight capture measured to close cleanly (walk, stroll, march, jog, run, sneak); march and sneak, which found no capture at all, work again.

          New: a sword is held the way a hand holds it. On the Stage a sword hand now lies along its forearm with the back of the hand and the knuckles outwards (it used to turn the palm out and break the wrist): the forearm rolls, the wrist tips, and the hilt lies a little askew in the grip, each within what an arm can do. The elbow goes where an elbow goes (out to the side under a raised hand, below a thrust, behind a hanging arm) and never flips; an arm near the end of its reach eases out instead of snapping straight; between two sword positions the hand travels round the shoulder in an arc and the point of the blade comes through the front; the chest turns with the sword without a jerk. The high, high-right and overhead positions now sit where an arm can hold them. In code films a closed hand seen from the back shows its knuckles, the thumb is outlined where it lies over the hand instead of along a jagged seam where it joins it, and a hand is drawn with a finer line than the body, so fingers a few pixels wide no longer close up into blots of ink.

          New: costume for real bodies in code films. A robe with long skirts that hang from the waist over the trousers, open in front with the lining showing and a trim along the hem, swinging and streaming behind a moving figure; sleeves of their own colour (a dark vest over a white robe); hair tied in a tail now hangs from its tie from the first frame of a shot and is bound with a cord of its own colour. Fingers that lie side by side are drawn as fingers, with a line between neighbours, and the thumb is outlined against the hand.

          New: real hands and faces for code films. Hands: fingers now close towards the palm on both hands (the right hand used to bend backwards), lie side by side instead of fanning out, the thumb rests beside the index finger, a fist is a fist with the thumb laid over the fingers, and a sword, spear or staff is held with the fingers wrapped round it; a hand the film does not pose is held naturally by itself. Faces: every real head now has a drawn nose (its shadow side follows the light, a shadow under the tip, nostrils, and the line of the nose when the head turns), lips with the line where they meet, the shadow under the lower lip, the crease of the eyelids, and the hair throws its shadow on the brow; a closed mouth no longer shows teeth. The 3D page closes the right hand the right way too. Films drawn before are drawn again with the new hands and faces the next time they are built.

          New: Studio voices — natural, acted delivery for every English and Hindi VolTune voice (real rhythm, breaths and pauses, much clearer Hindi), with emotions from plain directions such as (emotional hoke) or ‘is dialogue ko emotional hoke bolna hai’. Help → Studio voices… installs it once (about 1.5 GB, Chatterbox Multilingual, MIT licence, runs on this PC); then voice lines, Stage dialogue and code films use it. Also: 10 learned Hindi voices with 11 acted emotions, Hindi words हूँ, में, नहीं, क्यों pronounced fully again, and a better Hinglish reader.

          New in 2.5, the grand mega upgrade. Sensei — VideoStudio's own judge and helper: a measured review of every frame of a code film (motion, anatomy, camera, framing, picture, sound, story, and the drawing style against your own reference art), scores and a grade per category, marked frames with the exact fix, a gate that stops an export while a MUST is open; it talks (built in, a local model through Ollama, or your own key), searches the web, runs jobs side by side. A painted anime look (soft cel light, warm skin at the turn of the light, polished metal, hair sheen, rim light, painted skies). A 2D library of 587 pictures drawn by the app: backgrounds in five painted layers for the multiplane camera, cut-out characters with rigs that walk, pose, blink and speak, effects, props, faces, hands, balloons and titles, textures, pixel sprites, stick figures — in films, in the Code page and in Animate (characters come in as posable puppets). Animate → Fix a film shot: draw the better hand once and it follows that hand on every frame; erase what is wrong and the film draws what is behind it; every fix switches on and off. Code Studio: completion that knows the whole film kit and every id, checks while you type, Sensei's findings on the shot that has them, history of every file with a diff, a console, find in all files, ready pieces to insert. The director: write a scene as a cast and its beats (lines, waits, walks, gestures, looks, feelings) and it stages, times, covers and cuts it — an establishing shot, over-the-shoulder shots, close-ups and reactions — with 2D painted far layers around 3D sets. Every character line speaks with the open voice (tones, no download to wait on).

          New in 2.4, the mega update. Real bodies: characters drawn from a full anatomical body (163 bones) with five-finger hands that grip, real heads with acting faces and anime eyes, hair that swings, cloth layers and cast shadows; action with speed ramps, hit-stops, blade arcs, clashes and blood. Code Studio films in 11 looks: 2D anime, 2.5D multiplane, 3D render, 3.5D cel-shaded, 4D immersive, paper cut, puppet, flat motion graphics, pixel art, pencil sketch, manga; 854 library 3D models. Voices: 15 more voices, 18 new character voices, speech in German, Russian, Spanish, French, Italian, Portuguese, Dutch, Polish and more, read sentence by sentence like a person. Music: 33 new instruments made by the app (808, supersaws, FM keys, choirs, braams, risers, sitar, tanpura, bansuri, harmonium, santoor, shehnai, sarangi), trap, dance, lo-fi, film and tabla kits, 11 new styles, clearer singing and Vocals / Music / Clarity faders with stems.

          • VideoStudio-${VERSION}-amd64.deb — double-click to install (Discover / package installer). It removes the old VideoStudio Desktop package by itself and keeps your projects and the Claude link.
          • VideoStudio-${VERSION}-x86_64.AppImage — portable: allow executing, then open.

          New in 2.3: Code Studio — a Code page where a film is written as code: a real code editor, the frame under the cursor drawn at once, every shot kept as its own video so a change redraws only the shots it touches and the film is joined again in seconds (shots can be left out without deleting anything); a 2D library of 380 people, 22 places at four times of day, 126 props and 43 sounds; a 3D model library of 854 ready models (KayKit by Kay Lousberg, CC0) to stand beside the characters of the 3D Stage; and the Blender forge — your own Blender makes trees, rocks, land, buildings, 3D lettering or anything written for it, and converts fbx / obj / blend files, straight onto the Stage.
          New in 2.2: a 3D page (real human characters, 2,500+ motion-capture performances, walking with planted feet, sword and unarmed fight choreography, cameras that frame like an operator, cinematic and anime looks, a director's view and an action timeline); anime action for 2D (hit-stop, shake, zoom punch, flashes, afterimages, auras, on twos, speed lines, lightning, beams, one-tap moves); a Music page (261 instruments, 13 drum kits, a composer with 25 styles, ragas and taals, piano roll, MIDI in and out); VolTune voices that read Hindi, Hinglish and Indian English, speak in 15 tones and sing your lyrics.
          From 2.1: a colour page (grading nodes, wheels, custom and hue curves, HSL qualifier, animated power windows, .cube LUTs with camera transforms and film looks, LUT export, compare wipe), Shot Match and Auto balance, Audience Lens (predicted score, attention curve, one-click fixes, Evolve), Style DNA (measure and transplant the feel of any video), faster split-screen and 4K renders.
          From 2.0: native media core, professional player, video scopes, live view of every step Claude takes.

          Built from ${GITHUB_SHA::7}."
