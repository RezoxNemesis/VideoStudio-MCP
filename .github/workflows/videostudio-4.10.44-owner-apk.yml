name: VideoStudio 4.10.44 ARM64 Owner-Signed APK Candidate

on:
  push:
    branches: [ release/videostudio-v4.10.44-arm64-20261026 ]

permissions:
  contents: read

jobs:
  owner-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/package.xml" ]; then
            timeout 240s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null'
          fi
          test -f "$ANDROID_HOME/platforms/android-36/package.xml"
      - name: Compile and run editor release blockers
        working-directory: android
        run: |
          set -euo pipefail
          gradle :app:compileDebugJavaWithJavac :app:testDebugUnitTest \
            --tests com.rezoxnemesis.videostudio.StudioEditorWorkspaceConfigurationUiTest \
            --tests com.rezoxnemesis.videostudio.StudioEditorWorkspaceUiTest \
            --tests com.rezoxnemesis.videostudio.StudioKeyframeManagerTest \
            --tests com.rezoxnemesis.videostudio.StudioKeyframeAuthoringTest \
            --tests com.rezoxnemesis.videostudio.EditorPreviewUiTest \
            --tests com.rezoxnemesis.videostudio.NativeOfflineVideoMotionTest \
            --tests com.rezoxnemesis.videostudio.StudioCamera2DDirectorTest \
            --no-daemon --console=plain
      - name: Restore pre-existing owner signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: videostudio-android-debug-signing-v1
      - name: Verify exact original owner certificate
        run: |
          set -euo pipefail
          key="$HOME/.android/debug.keystore"
          test -r "$key" || { echo "::error::Original VideoStudio key not available: refusing mismatched APK"; exit 1; }
          fingerprint="$(keytool -list -v -keystore "$key" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2;exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$fingerprint" = "7e0187470356616be2a45bc7f41445894085185db110edfdc0cdfd232942a6dd" || {
            echo "::error::Original signer mismatch: refusing APK"; exit 1;
          }
      - name: Build signed 4.10.44 native candidate
        working-directory: android
        run: |
          set -euo pipefail
          export VIDEOSTUDIO_SIGNING_KEYSTORE="$HOME/.android/debug.keystore"
          gradle :app:assembleDebug --no-daemon --console=plain
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > app/build/outputs/apk/debug/apk-signature-proof.txt
          digest="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2;exit}' app/build/outputs/apk/debug/apk-signature-proof.txt | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$digest" = "7e0187470356616be2a45bc7f41445894085185db110edfdc0cdfd232942a6dd"
          python3 ../scripts/verify-android-apk.py --apk "$apk" --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:" > app/build/outputs/apk/debug/apk-package-proof.txt
          grep "versionName='4.10.44'" app/build/outputs/apk/debug/apk-package-proof.txt
          grep "versionCode='547'" app/build/outputs/apk/debug/apk-package-proof.txt
          # Every embedded shared library must be for the device's arm64-v8a ABI.
          abi_list="$(unzip -Z1 "$apk" | awk -F/ '/^lib\// {print $2}' | sort -u)"
          test "$abi_list" = "arm64-v8a" || {
            echo "::error::Unexpected native ABI packaging: $abi_list"; exit 1;
          }
          (cd app/build/outputs/apk/debug && sha256sum app-debug.apk > app-debug.apk.sha256)
      - name: Upload APK candidate and verification
        uses: actions/upload-artifact@v4
        with:
          name: VideoStudio-v4.10.44-build547-arm64-owner-signed
          retention-days: 7
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/debug/apk-package-proof.txt
            android/app/build/outputs/apk/debug/apk-signature-proof.txt
      - name: Upload focused Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videostudio-v4.10.44-editor-regression
          retention-days: 7
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
