name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: videostudio-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: Prepare stable development signing
        run: mkdir -p "$HOME/.android"

      - name: Restore stable development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: videostudio-android-debug-signing-v1
          save-always: true

      - name: Ensure stable development signing key exists
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "::error::Persistent Android signing keystore cache missing; refusing an incompatible replacement key"
            exit 1
          fi
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep -E "SHA256:|Valid from:"

      - name: Build debug APK
        working-directory: android
        run: |
          set -euo pipefail
          export VIDEOSTUDIO_SIGNING_KEYSTORE="$HOME/.android/debug.keystore"
          test -r "$VIDEOSTUDIO_SIGNING_KEYSTORE"
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      # Actual JNI/Canvas native artwork frames are rendered by Robolectric.
      # The QA sheet is intentionally synthetic test art, never the user's
      # private storyboard. Inspect before claiming visual animation quality.
      - name: Preserve Android JUnit diagnostics on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoStudio-native-junit-diagnostics
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish native storyboard visual QA samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoStudio-storyboard-visual-qa
          path: |
            android/app/build/storyboard-qa/
            android/app/build/source-rig-workbench/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK signing continuity
        env:
          VIDEOSTUDIO_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2;exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          actual="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2;exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          # Pin the pre-existing cached owner development key; never silently rotate it.
          pinned="7e0187470356616be2a45bc7f41445894085185db110edfdc0cdfd232942a6dd"
          if [ -z "$expected" ] || [ -z "$actual" ] || [ "$expected" != "$actual" ] || [ "$expected" != "$pinned" ]; then
            echo "::error::APK signer differs from the cached, pinned VideoStudio signing identity"
            exit 1
          fi
          echo "APK signing identity verified against owner development key."
          python3 scripts/verify-android-apk.py \
            --apk android/app/build/outputs/apk/debug/app-debug.apk \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoStudio-Android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/debug/VideoStudio-build-proof.json
          if-no-files-found: error

      - name: Prepare stable direct-download APK
        if: github.event_name == 'push'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk VideoStudio-latest.apk
          sha256sum VideoStudio-latest.apk | tee VideoStudio-latest.sha256
          {
            echo "Latest installable VideoStudio Android build from main."
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            echo "SHA-256:"
            echo '~~~'
            cat VideoStudio-latest.sha256
            echo '~~~'
          } > release-notes.md

      - name: Publish stable latest APK release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f videostudio-latest "$GITHUB_SHA"
          git push origin refs/tags/videostudio-latest --force

          if gh release view videostudio-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload videostudio-latest VideoStudio-latest.apk VideoStudio-latest.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit videostudio-latest \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --latest \
              --title "VideoStudio Latest Android APK" \
              --notes-file release-notes.md
          else
            gh release create videostudio-latest VideoStudio-latest.apk VideoStudio-latest.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --latest \
              --title "VideoStudio Latest Android APK" \
              --notes-file release-notes.md
          fi

