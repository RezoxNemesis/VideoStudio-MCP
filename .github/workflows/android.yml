name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: videostudio-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: Prepare stable development signing
        run: mkdir -p "$HOME/.android"

      - name: Restore stable development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: videostudio-android-debug-signing-v1
          save-always: true

      - name: Ensure stable development signing key exists
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=VideoStudio Development,O=VideoStudio,C=IN" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep -E "SHA256:|Valid from:"

      - name: Build debug APK
        working-directory: android
        run: |
          export VIDEOSTUDIO_DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Report matching-source tests and APK identity
        run: |
          python3 - <<'PY'
          import json, pathlib, hashlib, xml.etree.ElementTree as ET
          reports=list(pathlib.Path('android/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          totals={key:sum(int(ET.parse(p).getroot().get(key,0)) for p in reports) for key in ['tests','failures','errors','skipped']}
          assert reports and totals['tests']>0 and not totals['failures'] and not totals['errors'], totals
          print('ANDROID_UNIT_EVIDENCE '+json.dumps(totals,sort_keys=True))
          apk=pathlib.Path('android/app/build/outputs/apk/debug/app-debug.apk')
          with apk.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
          print('ANDROID_APK_EVIDENCE '+json.dumps({'bytes':apk.stat().st_size,'sha256':digest},sort_keys=True))
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoStudio-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoStudio-unit-test-results
          path: |
            android/app/build/test-results/testDebugUnitTest
            android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

      - name: Prepare stable direct-download APK
        if: github.event_name == 'push'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk VideoStudio-latest.apk
          sha256sum VideoStudio-latest.apk | tee VideoStudio-latest.sha256
          {
            echo "Latest installable VideoStudio Android build from main."
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            echo "SHA-256:"
            echo '~~~'
            cat VideoStudio-latest.sha256
            echo '~~~'
          } > release-notes.md

      - name: Publish stable latest APK release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f videostudio-latest "$GITHUB_SHA"
          git push origin refs/tags/videostudio-latest --force

          if gh release view videostudio-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload videostudio-latest VideoStudio-latest.apk VideoStudio-latest.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit videostudio-latest \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --latest \
              --title "VideoStudio Latest Android APK" \
              --notes-file release-notes.md
          else
            gh release create videostudio-latest VideoStudio-latest.apk VideoStudio-latest.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --latest \
              --title "VideoStudio Latest Android APK" \
              --notes-file release-notes.md
          fi

