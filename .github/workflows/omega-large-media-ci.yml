name: VideoStudio OMEGA Large-Media Regression Gate
on:
  push:
    branches: [feature/large-media-streaming-20261020]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-large-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  large-media-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK platform 36
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          if [ ! -f "$ANDROID_HOME/platforms/android-36/package.xml" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            timeout 240s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null'
          fi
      - name: Android compile and COMPLETE unit regressions
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:compileDebugJavaWithJavac :app:testDebugUnitTest --stacktrace
      - name: Persist JUnit XML and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OMEGA-large-media-regression-results
          if-no-files-found: warn
          retention-days: 14
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
# No key generation, installation, Gallery access or main merge.
