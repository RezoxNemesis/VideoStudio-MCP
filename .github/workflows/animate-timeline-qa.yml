name: Native Animate Timeline QA

on:
  push:
    branches: [feat/animate-style-native-timeline-20261019]
  pull_request:
    branches: [feat/native-anatomy-sketch-20261019]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-animate-timeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timeline-native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact authoring revision
        uses: actions/checkout@v4

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android API 36 and build tools
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME"
          if [ ! -f "$sdk/platforms/android-36/package.xml" ]; then
            timeout 240s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null'
          fi
          test -f "$sdk/platforms/android-36/package.xml"

      - name: Compile application and run targeted Animate-style native tests
        working-directory: android
        env:
          VIDEOSTUDIO_STORY_FILM_PROOF: '0'
        run: |
          set -euo pipefail
          gradle :app:compileDebugJavaWithJavac :app:testDebugUnitTest \
            --tests com.rezoxnemesis.videostudio.SketchAnimateTimelineToolsTest \
            --stacktrace

      - name: Preserve targeted Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animate-timeline-targeted-junit
          if-no-files-found: warn
          retention-days: 7
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/

# No APK assembly, key/identity change, remote deployment or owner phone access.
# Tests run against local source and Robolectric only; film-grade device QA is separate.
