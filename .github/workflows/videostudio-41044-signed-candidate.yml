name: VideoStudio 4.10.44 Signed Preview Candidate (unreleased)

on:
  push:
    branches:
      - release-candidate/videostudio-4.10.44-native-editor-20261025
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: videostudio-41044-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 36
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-36/package.xml" ]; then
            timeout 240s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null'
          fi
          test -f "$ANDROID_HOME/platforms/android-36/package.xml"
      - name: Restore unchanged owner signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: videostudio-android-debug-signing-v1
      - name: Reject missing or replaced signing identity
        run: |
          set -euo pipefail
          test -r "$HOME/.android/debug.keystore" || {
            echo "::error::Original owner debug signing key missing; no replacement APK"; exit 1;
          }
          observed="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey |
            awk -F': ' '/SHA256:/{print $2;exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          pinned="7e0187470356616be2a45bc7f41445894085185db110edfdc0cdfd232942a6dd"
          test "$observed" = "$pinned" || {
            echo "::error::Signing certificate differs from the owner-pinned original"; exit 1;
          }
      - name: Run source + full native regression suite
        working-directory: android
        run: gradle :app:compileDebugJavaWithJavac :app:testDebugUnitTest --no-daemon --console=plain --stacktrace
      - name: Build signed APK using unchanged certificate
        env:
          VIDEOSTUDIO_SIGNING_KEYSTORE: ${{ runner.home }}/.android/debug.keystore
        working-directory: android
        run: |
          set -euo pipefail
          export VIDEOSTUDIO_SIGNING_KEYSTORE="$HOME/.android/debug.keystore"
          gradle :app:assembleDebug --no-daemon --console=plain --stacktrace
      - name: Verify APK version and signature
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > /tmp/videostudio-signed.txt
          signing="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2;exit}' /tmp/videostudio-signed.txt | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$signing" = "7e0187470356616be2a45bc7f41445894085185db110edfdc0cdfd232942a6dd"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > /tmp/videostudio-badging.txt
          grep -q "versionCode='547'" /tmp/videostudio-badging.txt
          grep -q "versionName='4.10.44'" /tmp/videostudio-badging.txt
          python3 scripts/verify-android-apk.py --apk "$apk" --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Upload manually installable candidate (not a stable release)
        uses: actions/upload-artifact@v4
        with:
          name: VideoStudio-4.10.44-signed-preview-candidate-DO-NOT-PUBLISH
          retention-days: 7
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Preserve regression details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoStudio-4.10.44-native-test-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
